<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#08080a">
    <meta name="description" content="A library of game prototypes playable straight in the browser. No installs, no store pages.">
    <meta name="author" content="Enes Aksu">
    <meta name="robots" content="index, follow">
    <meta name="copyright" content="Copyright (c) 2026 Enes Aksu. All rights reserved.">

    <meta property="og:title" content="Prototype Library">
    <meta property="og:description" content="Game prototypes playable straight in the browser. Three.js, Unity and WebGL experiments.">
    <meta property="og:type" content="website">

    <title>Prototype Library</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff3a5e'/%3E%3Cpath d='M10 9h12L14 16h8l-12 8 4-8h-6z' fill='%23fff'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <a class="skip-link" href="#library" data-i18n="a11y.skip">Skip to the library</a>

    <!-- ============ NAV ============ -->
    <header class="nav" id="nav">
        <div class="shell nav__inner">
            <a class="brand" href="#top" aria-label="Home">
                <span class="brand__mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32"><path d="M10 9h12L14 16h8l-12 8 4-8h-6z" /></svg>
                </span>
            </a>

            <nav class="nav__links" aria-label="Primary">
                <a href="#library" data-i18n="nav.library">Library</a>
                <a href="#ads" data-i18n="nav.ads">Ads</a>
                <a href="#themes" data-i18n="nav.series">Themes</a>
                <a href="#contact" data-i18n="nav.contact">Contact</a>
            </nav>

            <button class="lang" id="langToggle" type="button" aria-label="Change language">
                <span data-i18n="nav.langLabel">TR</span>
            </button>
        </div>
    </header>

    <main id="top">
        <!-- ============ HERO ============ -->
        <section class="hero">
            <div class="hero__glow" aria-hidden="true"></div>
            <div class="shell">
                <h1 class="hero__title" data-i18n="hero.title">Prototype Library</h1>
                <p class="hero__sub" data-i18n="hero.subtitle">Game prototypes you can play in the browser.</p>

                <ul class="stats" id="stats"></ul>
            </div>
        </section>

        <!-- ============ LIBRARY ============ -->
        <section class="section" id="library">
            <div class="shell">
                <h2 class="section__title"><span data-i18n="sections.all">All prototypes</span></h2>
                <div class="grid" id="grid"></div>
            </div>
        </section>

        <!-- ============ PLAYABLE ADS ============ -->
        <section class="section" id="ads">
            <div class="shell">
                <h2 class="section__title"><span data-i18n="sections.ads">Playable ads</span></h2>
                <div id="campaigns"></div>
            </div>
        </section>

        <!-- ============ THEME VARIANTS ============ -->
        <section class="section" id="themes">
            <div class="shell">
                <h2 class="section__title"><span data-i18n="sections.series">Theme variants</span></h2>
                <div id="series"></div>
            </div>
        </section>
    </main>

    <!-- ============ FOOTER ============ -->
    <footer class="footer" id="contact">
        <div class="shell footer__inner">
            <p class="footer__rights" data-i18n="footer.rights"></p>
            <div class="footer__right">
                <a class="footer__mail" id="mailLink" href="#"></a>
                <ul class="social" id="social"></ul>
            </div>
        </div>
    </footer>

    <!-- ============ PLAYER ============ -->
    <div class="player" id="player" hidden role="dialog" aria-modal="true" aria-labelledby="playerTitle">
        <div class="player__bar">
            <div class="player__id">
                <h2 id="playerTitle"></h2>
                <p class="player__hint" data-i18n="labels.escHint"></p>
            </div>
            <div class="player__actions">
                <button class="btn btn--ghost" id="fsBtn" type="button"></button>
                <a class="btn btn--ghost" id="tabBtn" href="#" target="_blank" rel="noopener noreferrer"></a>
                <button class="btn btn--ghost" id="closeBtn" type="button"></button>
            </div>
        </div>
        <div class="player__stage" id="playerStage">
            <div class="player__frame" id="playerFrame">
                <div class="loader" id="loader"><span></span><span></span><span></span></div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
