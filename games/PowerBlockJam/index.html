// ─── game/howto.js ────────────────────────────────────────────
// HOW TO PLAY screen.
//
// Every entry pairs a short text with a live mini-board that draws the mechanic itself —
// a Painter surrounded by painted cells, a Magnet pulling them in, a region filling up.
// Reading beats a wall of text, and the diagrams animate so the eye follows what happens.

let htpScroll = 0;          // vertical scroll offset (px)
let htpMax = 0;             // max scroll, computed while drawing

// Mini-board renderer: cells is a 5×5 sketch using
//   '.' empty · 'x' filled · 'p' painted · 'P' Painter body · 'M' Magnet · 'o' about to clear
function miniBoard(x, y, size, cells, opts = {}){
  const n = cells.length, cs = size / n;
  const pulse = 0.5 + 0.5*Math.sin(now/300);
  ctx.save();
  // backdrop
  ctx.fillStyle = T.dark ? 'rgba(0,0,0,0.28)' : 'rgba(0,0,0,0.06)';
  rr(ctx, x-4, y-4, size+8, size+8, 8); ctx.fill();
  for (let r = 0; r < n; r++){
    for (let c = 0; c < n; c++){
      const ch = cells[r][c];
      const cx = x + c*cs, cy = y + r*cs, pad = cs*0.08;
      // empty slot
      ctx.fillStyle = C.empty;
      rr(ctx, cx+pad, cy+pad, cs-pad*2, cs-pad*2, cs*0.16); ctx.fill();
      if (ch === '.') continue;
      if (ch === 'x' || ch === 'o'){
        ctx.drawImage(blockSprite(cs,'wood',2),cx,cy,cs,cs);
        if (ch === 'o'){                       // cell that is about to clear
          ctx.globalAlpha = 0.4 + 0.4*pulse;
          ctx.fillStyle = C.accent;
          rr(ctx, cx+pad, cy+pad, cs-pad*2, cs-pad*2, cs*0.16); ctx.fill();
          ctx.globalAlpha = 1;
        }
      } else if (ch === 'p'){                  // painted cell
        ctx.drawImage(blockSprite(cs,'wood',0),cx,cy,cs,cs);
        ctx.globalAlpha = 0.22 + 0.18*pulse;
        ctx.fillStyle = PAINT_C;
        rr(ctx, cx+pad, cy+pad, cs-pad*2, cs-pad*2, cs*0.16); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = PAINT_C; ctx.lineWidth = Math.max(1.2, cs*0.07);
        rr(ctx, cx+pad, cy+pad, cs-pad*2, cs-pad*2, cs*0.16); ctx.stroke();
      } else if (ch === 'P' || ch === 'M'){    // a power block
        const col = ch === 'P' ? PAINT_C : MAGNET_C;
        ctx.drawImage(blockSprite(cs,'wood',0),cx,cy,cs,cs);
        ctx.globalAlpha = 0.5 + 0.25*pulse;
        ctx.fillStyle = col;
        rr(ctx, cx+pad, cy+pad, cs-pad*2, cs-pad*2, cs*0.16); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.6, cs*0.10);
        rr(ctx, cx+pad, cy+pad, cs-pad*2, cs-pad*2, cs*0.16); ctx.stroke();
      }
    }
  }
  // 3×3 region guides
  if (opts.regions){
    ctx.strokeStyle = T.dark ? 'rgba(255,255,255,0.22)' : 'rgba(0,0,0,0.22)';
    ctx.lineWidth = Math.max(1.5, cs*0.09);
    for (let i = 3; i < n; i += 3){
      ctx.beginPath(); ctx.moveTo(x+i*cs, y); ctx.lineTo(x+i*cs, y+size); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y+i*cs); ctx.lineTo(x+size, y+i*cs); ctx.stroke();
    }
  }
  // pull arrows: [[fromC,fromR,toC,toR], ...]
  if (opts.arrows){
    ctx.save(); ctx.lineCap = 'round';
    for (const [c0,r0,c1,r1] of opts.arrows){
      const ax = x+c0*cs+cs/2, ay = y+r0*cs+cs/2;
      const bx2 = x+c1*cs+cs/2, by2 = y+r1*cs+cs/2;
      ctx.globalAlpha = 0.55 + 0.35*pulse;
      ctx.strokeStyle = MAGNET_C; ctx.lineWidth = Math.max(2, cs*0.10);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx2, by2); ctx.stroke();
      ctx.fillStyle = MAGNET_C;
      ctx.beginPath(); ctx.arc(bx2, by2, cs*0.13, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();
}

// Each section: title key, body key, sketch, optional sketch options
function htpSections(){
  return [
    { t:'htpBasicsT',  s:'htpBasicsS',
      cells:['.....','.xx..','.xxx.','..x..','.....'] },
    { t:'htpRegionT',  s:'htpRegionS', opts:{regions:true},
      cells:['ooo...','ooo...','ooo...','......','......','......'] },
    { t:'htpPainterT', s:'htpPainterS', vars:{life: POWER_CFG.painterLife},
      cells:['.....','.ppp.','.pPp.','.ppp.','.....'] },
    { t:'htpMagnetT',  s:'htpMagnetS',
      cells:['.....','p...p','..M..','.....','p...p'],
      opts:{arrows:[[0,1,1,1],[4,1,3,1],[0,4,1,3],[4,4,3,3]]} },
    { t:'htpPairT',    s:'htpPairS',
      cells:['.....','.P.M.','.....','.....','.....'] },
    { t:'htpChainT',   s:'htpChainS',
      cells:['.....','.ppp.','ppPpp','.ppp.','.....'] },
    { t:'htpChainComboT', s:'htpChainComboS',
      vars:{ grace: POWER_CFG.comboGrace, bonus: POWER_CFG.comboLineBonus,
             max: POWER_CFG.comboLineMax },
      cells:['ooooo','.....','ooooo','.....','ooooo'] },
    { t:'htpRewardT',  s:'htpRewardS',
      cells:['..o..','..o..','ooooo','..o..','..o..'] },
    { t:'htpScoreT',   s:'htpScoreS',
      vars:{ line: POWER_CFG.lineScore, cell: POWER_CFG.paintedCellScore,
             step: POWER_CFG.comboStep },
      cells:['.....','.p.p.','..P..','.p.p.','.....'] },
  ];
}

function drawHowTo(){
  drawBackground();
  const pad = Math.round(Math.min(W,H)*0.045);
  const cardW = Math.min(W - pad*2, 520);
  const cardX = (W - cardW)/2;

  // header stays pinned
  const headH = Math.round(Math.min(64, H*0.09));
  txt(S('htpTitle'), W/2, headH*0.55, Math.min(22, W*0.055), C.accent, 'center', '800');

  const top = headH + 6;
  const botH = 64;
  const viewH = H - top - botH;

  ctx.save();
  ctx.beginPath(); ctx.rect(0, top, W, viewH); ctx.clip();

  let y = top + 8 - htpScroll;
  const sketch = Math.min(96, cardW*0.26);
  for (const sec of htpSections()){
    const bodyW = cardW - sketch - 22;
    const body = S(sec.s, sec.vars);
    const lines = wrapText(body, bodyW, 12.5);
    const h = Math.max(sketch + 16, 30 + lines.length*17);

    // only draw what is on screen
    if (y + h > top && y < top + viewH){
      ctx.fillStyle = T.dark ? 'rgba(255,255,255,0.045)' : 'rgba(0,0,0,0.035)';
      rr(ctx, cardX, y, cardW, h, 12); ctx.fill();

      miniBoard(cardX + 11, y + (h - sketch)/2, sketch, sec.cells, sec.opts || {});

      const tx0 = cardX + sketch + 22;
      txt(S(sec.t), tx0, y + 20, 13.5, C.text, 'left', '800');
      lines.forEach((ln, i) => txt(ln, tx0, y + 40 + i*17, 12.5, C.text2, 'left'));
    }
    y += h + 10;
  }
  ctx.restore();

  htpMax = Math.max(0, (y + htpScroll) - top - viewH + 12);

  // scroll hint
  if (htpMax > 0){
    const barH = Math.max(24, viewH * (viewH / (viewH + htpMax)));
    const barY = top + (viewH - barH) * (htpScroll / htpMax);
    ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = C.text2;
    rr(ctx, W - 6, barY, 3, barH, 2); ctx.fill(); ctx.restore();
  }

  button('htpback', cardX, H - botH + 8, cardW, 46, S('htpBack'), {primary:true});
}

// Greedy word wrap against the current canvas font metrics
function wrapText(str, maxW, size){
  ctx.font = `500 ${size}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
  const words = str.split(' '), out = [];
  let line = '';
  for (const w of words){
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line){ out.push(line); line = w; }
    else line = test;
  }
  if (line) out.push(line);
  return out;
}

// Scripted concept sketches. Kept outside run state, saves and core balance.
// Selection changes the demonstration, not the rules of a running game.
let conceptDemo = {kind:0, step:0, variant:0, at:0};
function conceptSpecs(){
  return [
    {tab:S('conceptGoal'), body:S('conceptGoalBody'), steps:[S('conceptPrepare'),S('conceptFill'),S('conceptGoalDone')]},
    {tab:S('conceptRelay'), body:S('conceptRelayBody'), steps:[S('conceptPrepare'),S('conceptFill'),S('conceptRelayDone')]},
    {tab:S('conceptMagnet'), body:S('conceptMagnetBody'), steps:[S('conceptChoose'),S('conceptPull'),S('conceptMagnetDone')]},
  ];
}

function handleConcept(id){
  if (scene!=='CONCEPTS') return;
  const [,action,value] = id.split(':');
  if (action==='tab' && ['0','1','2'].includes(value)){
    conceptDemo={kind:+value, step:0, variant:0, at:now};
  } else if (action==='variant' && (value==='0'||value==='1')){
    conceptDemo.variant=+value; conceptDemo.step=0; conceptDemo.at=now;
  } else if (action==='next'){
    conceptDemo.step=(conceptDemo.step+1)%3; conceptDemo.at=now;
  }
}

function drawConcepts(){
  drawBackground();
  const d=conceptDemo, specs=conceptSpecs(), spec=specs[d.kind];

  const tabW=(w-12)/3;

  wrapText(caption,tw,13).forEach((line,i)=>txt(line,tx,ty+23+i*17,13,C.text,align));

  if(d.kind===0){
    txt(S('conceptCores',{n:d.step===2?3:0}),W/2,footer+18,16,C.accent,'center','800');
  } else {
    const labels=d.kind===1?[S('conceptRelayOn'),S('conceptRelayOff')]:[S('conceptLeft'),S('conceptRight')];
    labels.forEach((label,i)=>button('concept:variant:'+i,x+i*(w+8)/2,footer,(w-8)/2,36,
      label,{primary:d.variant===i,textSize:14}));
  }
  const action=d.step===2?S('conceptReplay'):d.step===0?
    (d.kind===2?S('conceptDoPull'):S('conceptDoPlace')):S('conceptDoBlast');
  button('concept:next',x,footer+46,w,40,action,{primary:true,textSize:14});
}

function drawConceptBoard(x,y,size){
  const d=conceptDemo, cs=size/5;
  const t=Math.min(1,Math.max(0,(now-d.at)/650));
  const ease=1-Math.pow(1-t,3);
  let cells;
  if(d.kind===2){
    const col=d.variant===0?1:3;
    cells=['.xxx.','p...p','p.M.p','p...p','.xxx.'];
    if(d.step===1){
      cells=cells.map(row=>row.split(''));
      for(let r=1;r<=3;r++) cells[r][d.variant===0?0:4]='.';
      cells=cells.map(row=>row.join(''));
    } else if(d.step===2){
      cells=['.xxx.','.....','..M..','.....','.xxx.'].map(row=>row.split(''));
      for(let r=0;r<5;r++) cells[r][col]='.';
      cells=cells.map(row=>row.join(''));
    }
  } else {
    cells=d.step===0?['.....','.....','pp.pp','..P..','.....']:
      d.step===1?['.....','.....','ppppp','..P..','.....']:
      ['.....','.....','.....','..x..','.....'];
  }
  miniBoard(x,y,size,cells);

  // Motion is explicit: the selected side travels one cell toward the Magnet.
  if(d.kind===2&&d.step===1){
    const from=d.variant===0?0:4, to=d.variant===0?1:3;
    for(let r=1;r<=3;r++){
      ctx.save(); ctx.fillStyle=PAINT_C;
      rr(ctx,x+(from+(to-from)*ease)*cs+cs*0.08,y+r*cs+cs*0.08,cs*0.84,cs*0.84,cs*0.16);
      ctx.fill(); ctx.restore();
    }
  }
  if(d.kind===0&&d.step<2){
    for(const c of [0,1,4]) star(x+(c+0.5)*cs,y+cs*2.5,cs*0.19,C.accent);
  }
  if(d.kind!==2&&d.step===0){
    ctx.save(); ctx.strokeStyle=C.accent; ctx.lineWidth=2;
    ctx.setLineDash([4,4]); rr(ctx,x+cs*2+3,y+cs*2+3,cs-6,cs-6,4); ctx.stroke(); ctx.restore();
  }
  if(d.step===2&&t<1){
    ctx.save(); ctx.globalAlpha=1-t; ctx.strokeStyle=PAINT_C; ctx.lineWidth=4*(1-t)+1;
    ctx.beginPath(); ctx.arc(x+size/2,y+size/2,size*(0.1+ease*0.6),0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  if(d.kind===1){
    const s=Math.min(32,cs*0.75), rx=x+size-s, ry=y+size-s;
    ctx.save(); ctx.fillStyle=T.panel; rr(ctx,rx-s*2-8,ry-6,s*3+14,s+12,6); ctx.fill();
    ctx.restore();
    txtFit(S('conceptNextPiece'),rx-8,ry+s/2,11,C.text2,s*2-4,'right');
    miniBoard(rx,ry,s,[d.step===2&&d.variant===0?'p':'x']);
    if(d.step===2&&d.variant===0&&t<1){
      const ax=x+size/2, ay=y+size/2;
      ctx.save(); ctx.fillStyle=PAINT_C;
      ctx.beginPath(); ctx.arc(ax+(rx+s/2-ax)*ease,ay+(ry+s/2-ay)*ease,cs*0.14,0,Math.PI*2);
      ctx.fill(); ctx.restore();
    }
  }
}

// ─── game/input.js ────────────────────────────────────────────
// Main loop + pointer input (drag and drop).

// ------------------------------------------------------------- loop
let lastT=0;
function frame(t){
  now=t; const dt=Math.min(t-lastT,50); lastT=t;
  updateFx(dt);
  updateDragPhysics(dt);
  buttons=[];
  ctx.clearRect(0,0,W,H);
  if (scene==='MENU') drawMenu();
  else if (scene==='HOWTO') drawHowTo();
  else if (scene==='CONCEPTS') drawConcepts();
  else drawPlay();
  if (settingsOpen) drawSettings();
  requestAnimationFrame(frame);
}

function updateDragPhysics(dt){
  if (!drag || drag.howto || !st || !st.tray || st.tray[drag.ti] === null) return;
  const p = PIECES[st.tray[drag.ti]];
  if (!p) return;
  const cs = L.cell;

  let targetX = drag.px - p.w*cs/2;
  let targetY = drag.py - p.h*cs - L.cell*lift();

  // Magnetic Snap when hovering valid cell (Jelly Blocks feel)
  if (ghost && ghost.ok){
    const snapX = L.board.x + ghost.x * cs;
    const snapY = L.board.y + ghost.y * cs;
    targetX += (snapX - targetX) * 0.40;
    targetY += (snapY - targetY) * 0.40;
  }

  // Smooth Spring Follow
  const kFollow = 0.42;
  const nx = drag.x + (targetX - drag.x) * kFollow;
  const ny = drag.y + (targetY - drag.y) * kFollow;
  const dx = nx - drag.x, dy = ny - drag.y;
  drag.x = nx; drag.y = ny;

  // Velocity-driven sway & stretch
  drag.vx = (drag.vx || 0) + (dx - (drag.vx || 0)) * 0.35;
  drag.vy = (drag.vy || 0) + (dy - (drag.vy || 0)) * 0.35;
  const str = Math.min(0.12, Math.abs(drag.vx) * 0.012);
  const vstr = Math.min(0.10, Math.abs(drag.vy) * 0.012);
  drag.rot = (drag.rot || 0) + (Math.max(-10, Math.min(10, drag.vx * 0.40)) - (drag.rot || 0)) * 0.20;

  // Pickup pop scale spring
  drag.scale = drag.scale || 1;
  drag.scaleV = drag.scaleV || 0;
  drag.scaleV += (1.05 - drag.scale) * 0.32;
  drag.scaleV *= 0.60;
  drag.scale += drag.scaleV;
  drag.sx = drag.scale * (1 + str - vstr * 0.5);
  drag.sy = drag.scale * (1 - str * 0.7 + vstr);
}

// ------------------------------------------------------------- input
function pos(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
function hitBtn(p){ for(let i=buttons.length-1;i>=0;i--){ const b=buttons[i];
  if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h) return b; } return null; }

function ghostFor(p){
  const piece=PIECES[st.tray[drag.ti]];
  const gx=Math.round((p.x - piece.w*L.cell/2 - L.board.x)/L.cell);
  const gy=Math.round((p.y - piece.h*L.cell - L.cell*lift() - L.board.y)/L.cell);
  const ok=canPlace(st.board,piece,gx,gy);
  return {x:gx,y:gy,ok};
}

cv.addEventListener('pointerdown', e=>{
  e.preventDefault(); const p=pos(e);
  const b=hitBtn(p);
  if (b && !b.disabled){ handleBtn(b.id); return; }
  // how-to: drag anywhere to scroll
  if (scene==='HOWTO'){ drag={howto:true, py:p.y}; return; }
  if (scene!=='PLAY' || overlay || settingsOpen || now<lockUntil || st.phase!=='PLAYING') return;
  const slots=traySlots();
  for(let i=0;i<3;i++){
    const s=slots[i];
    if (st.tray[i]===null) continue;
    if (p.x>=s.x&&p.x<=s.x+s.w&&p.y>=s.y&&p.y<=s.y+s.h){
      const pcell = PIECES[st.tray[i]];
      const startX = s.x + (s.w - pcell.w*L.cell)/2;
      const startY = s.y + (s.h - pcell.h*L.cell)/2;
      drag={
        ti:i, px:p.x, py:p.y,
        x:startX, y:startY,
        vx:0, vy:0, rot:0,
        scale:0.86, scaleV:0.16,
        sx:0.86, sy:0.86
      };
      ghost=ghostFor(p); preview=null;
      if (ghost.ok) preview=previewClear(st.board,pcell,ghost.x,ghost.y);
      sfx('pickup');
      try{ cv.setPointerCapture(e.pointerId); }catch(_){}
      return;
    }
  }
});

cv.addEventListener('pointermove', e=>{
  if(!drag) return; e.preventDefault();
  const p=pos(e);
  if (drag.howto){
    htpScroll = Math.max(0, Math.min(htpMax, htpScroll + (drag.py - p.y)));
    drag.py = p.y; return;
  }
  drag.px=p.x; drag.py=p.y;
  ghost=ghostFor(p);
  preview = ghost.ok ? previewClear(st.board,PIECES[st.tray[drag.ti]],ghost.x,ghost.y) : null;
});

function endDrag(e){
  if(!drag) return;
  if (drag.howto){ drag=null; return; }
  const ti=drag.ti, g=ghost;
  drag=null; ghost=null; preview=null;
  if (!g || !g.ok) return;
  doPlace(ti,g.x,g.y);
}
cv.addEventListener('pointerup', e=>{ e.preventDefault(); endDrag(e); });
cv.addEventListener('pointercancel', ()=>{ drag=null; ghost=null; preview=null; });

// ─── game/main.js ─────────────────────────────────────────────
// Move handling: turns events coming from core into effects, sound and screen updates.
//
// doPlace lays out a single pipeline; each event type is handled in its own function. Those
// functions take a shared "presentation context" (p) and write a lock duration into it — the
// lock prevents a new move before the animation finishes. Adding a mechanic means writing one
// `fxXxx` function and adding one line to doPlace.

const boardCX = () => L.board.x + L.board.s/2;
const boardCY = (f=0.5) => L.board.y + L.board.s*f;
const cellCenter = (cx,cy) => { const r=cellRect(cx,cy); return [r.x+r.s/2, r.y+r.s/2]; };
const hold = (p,ms) => { p.lock = Math.max(p.lock, ms); };

function doPlace(ti,x,y){
  const piece = PIECES[st.tray[ti]];
  const ev = runMode ? placeRun(st,ti,x,y) : place(st,ti,x,y);
  if (!ev) return;

  const p = { lock:180, cells: piece.cells.map(([dx,dy])=>[x+dx,y+dy]) };

  fxPlacement(p);
  if (ev.cleared)        fxLineClear(ev, p);
  if (ev.comboLost)      fxComboLost(ev);
  if (ev.multiReward)    fxMultiReward(ev, p);
  if (ev.painterPlaced)  fxPainterPlaced(ev, p);
  fxMagnet(ev, p);
  if (ev.blast)          fxBlast(ev, p);
  else if (ev.expired && ev.expired.length) fxPaintExpired();
  if (ev.anchored)       fxAnchor(ev);

  finishMove(ev, p);
}

// --- the piece itself
function fxPlacement(p){
  addFx({kind:'place', dur:420, cells:p.cells});
  sfx('place');
}

// --- ordinary line/column clear
function fxLineClear(ev, p){
  addFx({kind:'clear', dur:240, cells:ev.cleared.cells});
  hold(p, 300);
  for (const [cx,cy] of ev.cleared.cells)
    spawnParticles(...cellCenter(cx,cy), T.blocks[variantOf(cx,cy)][0], 4);
  // The deeper the chain, the louder the release — this is the only place the chain is FELT.
  const deep = Math.min(1, (ev.combo-1)/6);
  shake = Math.min(1, (ev.cleared.n-1)*0.34 + deep*0.55);
  if (ev.combo>=3){ punch = Math.max(punch, 0.5+deep*0.5); hold(p, 300+deep*260); }
  sfx('clear', Math.min(ev.combo,8));
  if (ev.combo>1)
    addFx({kind:'combo', dur:520+deep*300, x:boardCX(), y:boardCY(),
           text:S('combo', {n: ev.combo})});
}

// The chain finally ran out of grace. It has to be mourned, or the pips mean nothing.
function fxComboLost(ev){
  if (ev.comboLost < 2) return;                  // a chain of 1 was never a chain
  sfx('fizzle');
  addFx({kind:'combo', dur:640, x:boardCX(), y:boardCY(0.30),
         text:S('comboLost', {n: ev.comboLost})});
}

// --- multi-line reward: the hardest thing in the game gets the loudest celebration
function fxMultiReward(ev, p){
  const mr = ev.multiReward;
  punch = 1; freeze = 90;
  shake = Math.max(shake, 0.8);
  hold(p, 620);
  addFx({kind:'combo', dur:900, x:boardCX(), y:boardCY(0.22), text:S('linesAtOnce', {n: mr.n})});

  if (mr.kind === 'SPAWN'){
    const [cx,cy] = cellCenter(mr.cell[0], mr.cell[1]);
    addFx({kind:'spawn', dur:760, x:cx, y:cy});          // ring that draws the eye to the new Painter
    spawnParticles(cx, cy, PAINT_C, 26);
    for (const [px,py] of mr.painted||[]) spawnParticles(...cellCenter(px,py), PAINT_C, 5);
    addFx({kind:'bignum', dur:1000, x:boardCX(), y:boardCY(0.46),
           text:S('painterSpawned'), sub:S('rewardFreshSetup')});
  } else {
    addFx({kind:'bignum', dur:1000, x:boardCX(), y:boardCY(0.46),
           text:S('painterEmpowered'), sub:S('timerRefreshed', {limit: mr.limit})});
    if (st.painter)
      for (const [px,py] of st.painter.cells) spawnParticles(...cellCenter(px,py), PAINT_C, 18);
  }
  sfx('reward');
  showHint('multi');
}

// --- a Painter was placed
function fxPainterPlaced(ev, p){
  sfx('paint');
  for (const [cx,cy] of ev.painterPlaced.cells) spawnParticles(...cellCenter(cx,cy), PAINT_C, 3);
  hold(p, 220);
}

// --- Magnet: pull animation and the synergy moment
function fxMagnet(ev, p){
  if (!ev.pulled || !ev.pulled.length){
    // if it found nothing to pull, do not stay silent — let the player see the power was wasted
    if (ev.power === 'MAGNET')
      addFx({kind:'combo', dur:520, x:boardCX(), y:boardCY(0.30), text:S('nothingToPull')});
    return;
  }
  addFx({kind:'pull', dur:340, moves:ev.pulled, mag:p.cells});
  hold(p, 380);
  for (const m of ev.pulled)
    spawnParticles(...cellCenter(m.to[0], m.to[1]), m.painted?PAINT_C:MAGNET_C, m.painted?9:3);

  const syn = ev.pulled.filter(m=>m.painted).length;
  if (!syn) { sfx('magnet'); return; }
  // THE MOMENT THE TWO POWERS WORK TOGETHER — if the player misses this, there is no synergy
  punch = 0.7; freeze = 70;
  shake = Math.max(shake, 0.45);
  addFx({kind:'combo', dur:760, x:boardCX(), y:boardCY(0.30), text:S('synergy', {n: syn})});
  sfx('synergy');
}

// --- mass blast: CHARGE → HIT-STOP → RELEASE
// An instant blast goes unnoticed; there is no release without anticipation (spec §7).
const BLAST_CHARGE = 260;
function fxBlast(ev, p){
  const cells = ev.blast.cells;
  if (cells.length){
    addFx({kind:'blast', dur:BLAST_CHARGE+300, charge:BLAST_CHARGE, cells});
    const [fx0,fy0] = cells[0];
    flash = { color:PAINT_C, t:-BLAST_CHARGE, dur:300, x:fx0, y:fy0 };   // flash comes AFTER the charge
  }
  setTimeout(() => blastRelease(ev, cells), BLAST_CHARGE);
  sfx('charge');
  hold(p, BLAST_CHARGE + 420);
  showHint('blast');
}

function blastRelease(ev, cells){
  freeze = 110;
  punch = 1;
  blastFlash = 1;
  shake = Math.max(shake, Math.min(1.4, 0.5 + ev.blast.total*0.075));
  for (const [cx,cy] of cells){
    const c = cellCenter(cx,cy);
    spawnParticles(...c, PAINT_C, 20);
    spawnParticles(...c, '#FFFFFF', 6);
  }
  // Swept cells get a smaller, non-pink puff: they were never painted, so colouring them PAINT_C
  // would read as if the whole block had been part of the setup. The core already wiped them by
  // now, so variantOf falls through to its coordinate spread rather than the block's real colour
  // — the same approximation fxLineClear has always made for cleared cells.
  for (const [cx,cy] of (ev.blast.swept || []))
    spawnParticles(...cellCenter(cx,cy), T.blocks[variantOf(cx,cy)][0], 8);
  const stk = ev.streak || 1;
  addFx({kind:'bignum', dur:900, x:boardCX(), y:boardCY(0.42),
         text:`+${ev.blast.points}`,
         sub:S('cellsMult', {n: ev.blast.total, mult: ev.blast.mult.toFixed(1)}),
         streak: stk});
  sfx('blast', stk);
  if (stk>1) punch = Math.min(1, 0.7 + stk*0.1);        // the longer the streak, the harder the hit
  if (ev.blast.repainted && ev.blast.repainted.length)
    setTimeout(() => painterSurvived(ev), 260);
}

// If the Painter survived the blast the player must see it — otherwise they miss the chain
function painterSurvived(ev){
  addFx({kind:'combo', dur:820, x:boardCX(), y:boardCY(0.62),
         text:S('painterAlive', {n: st.painter?st.painter.remaining:0})});
  for (const [cx,cy] of ev.blast.repainted) spawnParticles(...cellCenter(cx,cy), PAINT_C, 4);
  sfx('charge');
}

// --- Anchor: the debris the blast just made slides back in and lights up as new fuel.
// It plays AFTER the blast has actually gone off — underneath the explosion nobody would read it.
// Deliberately does NOT extend the input lock: the blast already holds input for ~460-570ms,
// which is long enough to swallow a tap, and this animation is safe to finish while the player
// is already dragging the next piece.
// The delay carries the run token for the same reason the end-of-run overlay does: Retry inside
// the window would otherwise stamp these effects onto a brand new run.
function fxAnchor(ev){
  const token = overlayToken;
  setTimeout(() => {
    if (token !== overlayToken) return;
    addFx({kind:'pull', dur:340, moves:ev.anchored.moves});
    for (const m of ev.anchored.moves)
      spawnParticles(...cellCenter(m.to[0], m.to[1]), PAINT_C, 5);
    addFx({kind:'combo', dur:760, x:boardCX(), y:boardCY(0.72),
           text:S('anchorFired', {n: ev.anchored.moves.length})});
    sfx('magnet');
  }, BLAST_CHARGE + 300);
}

function fxPaintExpired(){
  addFx({kind:'combo', dur:600, x:boardCX(), y:boardCY(0.30), text:S('paintFaded')});
  sfx('fizzle');
  showHint('expire');
}

// --- end of move: lock, tray animation, save, end screen
function finishMove(ev, p){
  if (ev.rescued >= 0) shake = 0.3;
  lockUntil = now + p.lock;
  if (ev.refilled) trayAnim = 1;
  if (st.phase === 'PLAYING') return;

  if (st.phase === 'WON'){
    lastStars = starsFor(level, st.moves);
    const prev = SAVE.levels[level.id];
    if (!prev || prev.stars<lastStars || prev.moves>st.moves)
      SAVE.levels[level.id] = { stars:lastStars, moves:st.moves, score:st.score };
    writeSave(SAVE); sfx('win');
  } else if (runMode){
    if (!SAVE.best      || st.score      > SAVE.best)      SAVE.best = st.score;
    if (!SAVE.bestLines || st.linesTotal > SAVE.bestLines) SAVE.bestLines = st.linesTotal;
    writeSave(SAVE);
  }
  // Delayed so the last clear can play out. If the player hits Retry inside that window a new
  // run is already under way, and this timer would stamp a phantom game-over panel over it.
  const token = overlayToken;
  setTimeout(() => {
    if (token !== overlayToken || st.phase === 'PLAYING') return;
    overlay = st.phase; overlayAt = performance.now();
  }, p.lock + 280);
}

function handleBtn(id){
  if (id==='concepts'){
    conceptDemo={kind:0, step:0, variant:0, at:now};
    drag=null; ghost=null; preview=null; settingsOpen=false;
    scene='CONCEPTS'; return;
  }
  if (id.startsWith('concept:')){ handleConcept(id); return; }
  if (id==='back'||id==='lvsel'){ labRestore(); scene='MENU'; overlay=null; settingsOpen=false; return; }
  if (id==='menu'||id==='gear'){ settingsOpen=true; return; }
  if (id==='closeset'){ settingsOpen=false; writeSave(SAVE); return; }
  if (id.startsWith('lift')){ SAVE.settings.lift=LIFT_OPTIONS[+id.slice(4)].v; writeSave(SAVE); return; }
  if (id==='sound'){ SAVE.settings.sound=!SAVE.settings.sound; writeSave(SAVE); return; }
  if (id==='popfx'){ SAVE.settings.popPhysics=SAVE.settings.popPhysics===false?true:false; writeSave(SAVE); return; }
  if (id.startsWith('lang')){ SAVE.settings.lang=LANGS[+id.slice(4)]; writeSave(SAVE); return; }
  // lab dials are NOT saved: they are a testing state, and persisting them would make a later
  // session play a different game with no way to tell.
  if (id.startsWith('lab')){ labToggle(LAB_DIALS[+id.slice(3)]); return; }
  if (id==='howto'){ scene='HOWTO'; htpScroll=0; return; }
  if (id==='htpback'){ scene='MENU'; return; }
  if (id.startsWith('thm')){ SAVE.settings.theme=THEME_KEYS[+id.slice(3)]; applyTheme(SAVE.settings.theme); writeSave(SAVE); return; }
  if (id==='restart'||id==='retry'){
    // Retry must stay in the same mode, or an experimental run silently becomes a normal one
    if(runMode) startRun({regionFree: st.board.regionFree}); else startLevel(level); return; }
  if (id==='next'){
    const i=levels.findIndex(l=>l.id===level.id);
    if(i+1<levels.length) startLevel(levels[i+1]); else { scene='MENU'; overlay=null; }
    return;
  }
  if (id==='sonsuz'){ startRun({regionFree:true}); return; }
  if (id==='classicmode'){ startRun({regionFree:false}); return; }
  if (id==='freemode'){ startRun({regionFree:true}); return; }
  if (id==='undo'){ if(undo(st)) sfx('place'); return; }
  if (id==='reset'){ const st0=SAVE.settings; SAVE={levels:{}, unlockAll:false, settings:st0}; writeSave(SAVE); return; }
  if (id==='unlockall'){ SAVE.unlockAll=true; writeSave(SAVE); return; }
  if (id.startsWith('lv')){
    const lv=levels.find(l=>l.id===+id.slice(2));
    if (lv && unlocked(lv.id)) startLevel(lv);
  }
}

// ------------------------------------------------------------- boot
applyTheme(SAVE.settings.theme);
resize();
requestAnimationFrame(frame);

// test hook (Playwright)
window.__t = { core:{ GRID_W,GRID_H,FULL,PIECES,PIECE_ORDER,makeRng,rngNext,drawPiece,newBoard,
  canPlace,clearLines,isRowClearable,isColClearable,newGame,place,undo,isDead,anyFit,popcount,parseBoard,starsFor,
  regionOrigins,                           // lets the smoke test count 9 aligned vs 49 free 3×3s
  newRun,placeRun,refillRun,POWER_CFG },
  levels, get state(){return st;}, start:(id)=>startLevel(levels.find(l=>l.id===id)),
  goMenu:()=>{labRestore();scene='MENU';overlay=null;}, setMute:(m)=>{muted=m;},
  get layout(){return L;}, traySlots, get overlay(){return overlay;}, drop:doPlace,
  get settingsOpen(){return settingsOpen;}, get buttons(){return buttons;}, setLift:(v)=>{SAVE.settings.lift=v;writeSave(SAVE);},
  get lift(){return lift();}, startRun, get runMode(){return runMode;}, POWER_CFG,
  btn:(id)=>handleBtn(id), setLang:(l)=>{SAVE.settings.lang=l; writeSave(SAVE);},
  scroll:(dy)=>{ htpScroll=Math.max(0,Math.min(htpMax,htpScroll+dy)); },
  resize,                                  // lets the smoke test check small/odd screen sizes
  get hintRect(){return hintRect;}, get comboFx(){return fx.filter(f=>f.kind==='combo').length;},
  get scene(){return scene;},
  // screen coordinate needed to drop a piece at (gx,gy)
  dropPoint:(ti,gx,gy)=>{ const p=PIECES[st.tray[ti]];
    return { x:L.board.x+gx*L.cell+p.w*L.cell/2, y:L.board.y+gy*L.cell+p.h*L.cell+L.cell*lift() }; },
  slotCenter:(ti)=>{ const s=traySlots()[ti]; return {x:s.x+s.w/2, y:s.y+s.h/2}; },
  findSpot:(ti)=>{ const p=PIECES[st.tray[ti]];
    for(let y=0;y<=GRID_H-p.h;y++) for(let x=0;x<=GRID_W-p.w;x++)
      if(canPlace(st.board,p,x,y)) return {x,y};
    return null; },
  setDrag:(ti,gx,gy)=>{
    if (ti===null){ drag=null; ghost=null; preview=null; return; }
    const p=PIECES[st.tray[ti]];
    drag = { ti, px: L.board.x+gx*L.cell, py: L.board.y+gy*L.cell };
    ghost = { x: gx, y: gy, ok: canPlace(st.board, p, gx, gy) };
    preview = ghost.ok ? previewClear(st.board, p, gx, gy) : null;
  } };


</script>
