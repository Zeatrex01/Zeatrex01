// ─── game/sprites.js ──────────────────────────────────────────
// Block sprites are generated onto a Canvas at runtime and cached.
// The background lives here too: drawn once per theme and cached.

// ------------------------------------------------------------- sprite generation
const spriteCache = new Map();
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function poly(g,pts){ g.beginPath(); g.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) g.lineTo(pts[i][0],pts[i][1]); g.closePath(); }

function blockSprite(size, kind, variant, theme=T){
  const key = theme.name+'|'+kind+'|'+variant+'|'+Math.round(size);
  if (spriteCache.has(key)) return spriteCache.get(key);
  const s = Math.max(8, Math.round(size));
  const cnv = document.createElement('canvas');
  cnv.width = s; cnv.height = s;
  const g = cnv.getContext('2d');
  const pad = Math.max(1, s*0.05), r = Math.max(2, s*0.20);
  const iw = s - pad*2;

  let top, bot;
  if (kind === 'blocker'){ [top,bot] = theme.blocker; }
  else if (kind === 'target'){ [top,bot] = theme.target; }
  else { [top,bot] = theme.blocks[variant % theme.blocks.length]; }

  const style = kind === 'blocker' ? 'blocker' : theme.style;

  if (style === 'jelly'){
    // 1. SLIME / JELLY: Plump squishy drop with cute kawaii bubble speculars
    const jr = Math.max(3, s * 0.28);
    g.save();
    g.shadowColor = 'rgba(0,0,0,0.42)'; g.shadowBlur = s * 0.10;
    g.shadowOffsetY = s * 0.045;
    g.fillStyle = bot; rr(g, pad, pad, iw, iw, jr); g.fill();
    g.restore();

    // 3D jelly volume
    const gr = g.createRadialGradient(pad + iw*0.35, pad + iw*0.32, Math.max(1, iw*0.06), pad + iw*0.5, pad + iw*0.5, iw*0.72);
    gr.addColorStop(0, top);
    gr.addColorStop(0.52, top);
    gr.addColorStop(1, bot);
    g.fillStyle = gr; rr(g, pad, pad, iw, iw, jr); g.fill();

    g.save();
    rr(g, pad, pad, iw, iw, jr); g.clip();

    // Gooey bottom bounce glow
    const bgr = g.createLinearGradient(0, pad + iw*0.55, 0, pad + iw);
    bgr.addColorStop(0, 'rgba(255,255,255,0)');
    bgr.addColorStop(1, 'rgba(255,255,255,0.38)');
    g.fillStyle = bgr; g.fillRect(pad, pad + iw*0.55, iw, iw*0.45);

    // Kawaii dual shine drops: main glossy oval + small companion dot
    g.fillStyle = 'rgba(255,255,255,0.78)';
    g.beginPath();
    g.ellipse(pad + iw*0.30, pad + iw*0.25, iw*0.20, iw*0.09, -0.38, 0, Math.PI*2);
    g.fill();

    g.fillStyle = 'rgba(255,255,255,0.72)';
    g.beginPath();
    g.arc(pad + iw*0.64, pad + iw*0.30, Math.max(1.4, iw*0.055), 0, Math.PI*2);
    g.fill();

    g.restore();

    g.strokeStyle = 'rgba(255,255,255,0.30)';
    g.lineWidth = Math.max(1, s * 0.035);
    rr(g, pad, pad, iw, iw, jr); g.stroke();
  } else if (style === 'candy'){
    // 2. CANDY: Bold striped peppermint swirl bonbon with glossy sugar shell
    const cr = Math.max(3, s * 0.35);
    g.save();
    g.shadowColor = 'rgba(0,0,0,0.40)'; g.shadowBlur = s * 0.14;
    g.fillStyle = bot; rr(g, pad, pad, iw, iw, cr); g.fill();
    g.restore();

    // Base candy color
    const gr = g.createRadialGradient(pad + iw*0.35, pad + iw*0.35, Math.max(1, iw*0.05), pad + iw*0.5, pad + iw*0.5, iw*0.70);
    gr.addColorStop(0, top);
    gr.addColorStop(1, bot);
    g.fillStyle = gr; rr(g, pad, pad, iw, iw, cr); g.fill();

    g.save();
    rr(g, pad, pad, iw, iw, cr); g.clip();

    // BOLD DIAGONAL CANDY STRIPES (Unmistakable candy look!)
    g.strokeStyle = 'rgba(255,255,255,0.42)';
    g.lineWidth = Math.max(2, iw * 0.16);
    g.lineCap = 'round';
    for (let d = -iw; d <= iw*2; d += iw*0.38){
      g.beginPath();
      g.moveTo(pad + d, pad - iw*0.2);
      g.lineTo(pad + d + iw*1.2, pad + iw*1.2);
      g.stroke();
    }

    // High-gloss glazed dome overlay
    const dome = g.createRadialGradient(pad + iw*0.30, pad + iw*0.28, Math.max(1, iw*0.06), pad + iw*0.5, pad + iw*0.5, iw*0.65);
    dome.addColorStop(0, 'rgba(255,255,255,0.55)');
    dome.addColorStop(0.45, 'rgba(255,255,255,0.05)');
    dome.addColorStop(1, 'rgba(0,0,0,0.25)');
    g.fillStyle = dome; g.fillRect(pad, pad, iw, iw);

    // Bright sugar shine crescent
    g.fillStyle = 'rgba(255,255,255,0.95)';
    g.beginPath();
    g.ellipse(pad + iw*0.28, pad + iw*0.22, iw*0.18, iw*0.07, -0.42, 0, Math.PI*2);
    g.fill();

    // 4-point sugar star twinkle
    const sx = pad + iw*0.64, sy = pad + iw*0.26, sr = Math.max(1.8, iw*0.09);
    g.fillStyle = 'rgba(255,255,255,0.92)';
    g.beginPath();
    g.moveTo(sx, sy - sr);
    g.quadraticCurveTo(sx, sy, sx + sr, sy);
    g.quadraticCurveTo(sx, sy, sx, sy + sr);
    g.quadraticCurveTo(sx, sy, sx - sr, sy);
    g.quadraticCurveTo(sx, sy, sx, sy - sr);
    g.fill();

    g.restore();

    g.strokeStyle = 'rgba(255,255,255,0.45)';
    g.lineWidth = Math.max(1, s * 0.035);
    rr(g, pad, pad, iw, iw, cr); g.stroke();
  } else if (style === 'marshmallow'){
    // 3. MARSHMALLOW / FLUFF: Plump quilted plush cushion with stitched seam
    const mr = Math.max(4, s * 0.32);
    g.save();
    g.shadowColor = 'rgba(0,0,0,0.28)'; g.shadowBlur = s * 0.16; g.shadowOffsetY = s * 0.04;
    g.fillStyle = bot; rr(g, pad, pad, iw, iw, mr); g.fill();
    g.restore();

    // Soft powdery matte lighting
    const gr = g.createRadialGradient(pad + iw*0.5, pad + iw*0.38, Math.max(1, iw*0.05), pad + iw*0.5, pad + iw*0.5, iw*0.68);
    gr.addColorStop(0, top);
    gr.addColorStop(0.75, bot);
    gr.addColorStop(1, bot);
    g.fillStyle = gr; rr(g, pad, pad, iw, iw, mr); g.fill();

    g.save();
    rr(g, pad, pad, iw, iw, mr); g.clip();

    // Tufted center cushion indentation
    g.strokeStyle = 'rgba(0,0,0,0.14)';
    g.lineWidth = Math.max(1.2, s * 0.06);
    g.beginPath();
    g.moveTo(pad + iw*0.5, pad + iw*0.16); g.lineTo(pad + iw*0.5, pad + iw*0.84);
    g.moveTo(pad + iw*0.16, pad + iw*0.5); g.lineTo(pad + iw*0.84, pad + iw*0.5);
    g.stroke();

    // 4 Pillowy highlight cushions in the 4 corners
    g.fillStyle = 'rgba(255,255,255,0.38)';
    g.beginPath(); g.arc(pad + iw*0.32, pad + iw*0.32, iw*0.13, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(pad + iw*0.68, pad + iw*0.32, iw*0.11, 0, Math.PI*2); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.22)';
    g.beginPath(); g.arc(pad + iw*0.32, pad + iw*0.68, iw*0.10, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(pad + iw*0.68, pad + iw*0.68, iw*0.09, 0, Math.PI*2); g.fill();

    // DASHED PLUSH STITCH SEAM around perimeter (unmistakable plushie / cushion look!)
    g.strokeStyle = 'rgba(255,255,255,0.55)';
    g.lineWidth = Math.max(1.2, s * 0.038);
    g.setLineDash([Math.max(2, s*0.06), Math.max(2, s*0.06)]);
    rr(g, pad + iw*0.10, pad + iw*0.10, iw*0.80, iw*0.80, mr*0.65);
    g.stroke();

    g.restore();

    g.strokeStyle = 'rgba(255,255,255,0.40)';
    g.lineWidth = Math.max(1, s * 0.03);
    rr(g, pad, pad, iw, iw, mr); g.stroke();
  } else if (style === 'gem'){
    // 4. GEM: True chamfered octagonal emerald-cut jewel with brilliant facets
    const c = iw * 0.25; // Corner chamfer
    const pts = [
      [pad + c, pad], [pad + iw - c, pad],
      [pad + iw, pad + c], [pad + iw, pad + iw - c],
      [pad + iw - c, pad + iw], [pad + c, pad + iw],
      [pad, pad + iw - c], [pad, pad + c]
    ];

    g.save();
    g.shadowColor = top; g.shadowBlur = s * 0.16;
    g.fillStyle = bot; poly(g, pts); g.fill();
    g.restore();

    g.save();
    poly(g, pts); g.clip();

    // Table (inner flat octagon face)
    const tc = c * 0.55;
    const tpad = pad + iw * 0.22, tiw = iw * 0.56;
    const tpts = [
      [tpad + tc, tpad], [tpad + tiw - tc, tpad],
      [tpad + tiw, tpad + tc], [tpad + tiw, tpad + tiw - tc],
      [tpad + tiw - tc, tpad + tiw], [tpad + tc, tpad + tiw],
      [tpad, tpad + tiw - tc], [tpad, tpad + tc]
    ];

    // 8 Facets connecting outer octagon to table:
    // Top trapezoid (brightest light)
    g.fillStyle = 'rgba(255,255,255,0.48)';
    poly(g, [pts[0], pts[1], tpts[1], tpts[0]]); g.fill();

    // Top-Right triangle facet
    g.fillStyle = 'rgba(255,255,255,0.35)';
    poly(g, [pts[1], pts[2], tpts[1]]); g.fill();

    // Right trapezoid (midtone)
    g.fillStyle = 'rgba(0,0,0,0.18)';
    poly(g, [pts[2], pts[3], tpts[3], tpts[2]]); g.fill();

    // Bottom-Right triangle facet (deep shadow)
    g.fillStyle = 'rgba(0,0,0,0.42)';
    poly(g, [pts[3], pts[4], tpts[3]]); g.fill();

    // Bottom trapezoid (deep shadow)
    g.fillStyle = 'rgba(0,0,0,0.45)';
    poly(g, [pts[4], pts[5], tpts[5], tpts[4]]); g.fill();

    // Bottom-Left triangle facet (deep shadow)
    g.fillStyle = 'rgba(0,0,0,0.38)';
    poly(g, [pts[5], pts[6], tpts[5]]); g.fill();

    // Left trapezoid (midtone reflection)
    g.fillStyle = 'rgba(255,255,255,0.24)';
    poly(g, [pts[6], pts[7], tpts[7], tpts[6]]); g.fill();

    // Top-Left triangle facet (strong reflection)
    g.fillStyle = 'rgba(255,255,255,0.40)';
    poly(g, [pts[7], pts[0], tpts[0]]); g.fill();

    // Center Table Facet
    const tgr = g.createLinearGradient(tpad, tpad, tpad + tiw, tpad + tiw);
    tgr.addColorStop(0, top);
    tgr.addColorStop(1, bot);
    g.fillStyle = tgr; poly(g, tpts); g.fill();

    // Prismatic brilliant starburst flare on table top-left
    const tx = tpts[0][0], ty = tpts[0][1], tr = Math.max(1.8, iw*0.11);
    g.fillStyle = 'rgba(255,255,255,0.98)';
    g.beginPath();
    g.moveTo(tx, ty - tr);
    g.quadraticCurveTo(tx, ty, tx + tr, ty);
    g.quadraticCurveTo(tx, ty, tx, ty + tr);
    g.quadraticCurveTo(tx, ty, tx - tr, ty);
    g.quadraticCurveTo(tx, ty, tx, ty - tr);
    g.fill();

    // Hairline facet facet ridges (sharp laser reflections)
    g.strokeStyle = 'rgba(255,255,255,0.22)';
    g.lineWidth = Math.max(0.7, s * 0.016);
    poly(g, tpts); g.stroke();
    for (let i = 0; i < 8; i++){
      g.beginPath(); g.moveTo(pts[i][0], pts[i][1]); g.lineTo(tpts[i][0], tpts[i][1]); g.stroke();
    }

    g.restore();

    // Outer octagonal contour
    g.strokeStyle = 'rgba(255,255,255,0.55)';
    g.lineWidth = Math.max(1.2, s * 0.035);
    poly(g, pts); g.stroke();
  } else if (style === 'pixel'){
    // 5. PIXEL: Chunky 8-bit retro arcade brick with rivets & 3D bevels
    const px = Math.max(2, Math.round(s * 0.10));
    // Dark arcade pixel border
    g.fillStyle = '#06060c';
    g.fillRect(pad, pad, iw, iw);

    // Stepped pixel corners (true 8-bit retro staircase)
    g.clearRect(pad, pad, px, px);
    g.clearRect(pad + iw - px, pad, px, px);
    g.clearRect(pad, pad + iw - px, px, px);
    g.clearRect(pad + iw - px, pad + iw - px, px, px);

    // Inner face
    g.fillStyle = bot;
    g.fillRect(pad + px, pad + px, iw - px*2, iw - px*2);

    // 3D Bevel: Top & Left bright highlight
    g.fillStyle = top;
    g.fillRect(pad + px, pad + px, iw - px*2, px);
    g.fillRect(pad + px, pad + px, px, iw - px*2);

    // 3D Bevel: Bottom & Right dark shadow
    g.fillStyle = 'rgba(0,0,0,0.50)';
    g.fillRect(pad + px, pad + iw - px*2, iw - px*2, px);
    g.fillRect(pad + iw - px*2, pad + px, px, iw - px*2);

    // 4 Corner Arcade Rivets / Bolts
    const rvx = pad + px*1.8, rvy = pad + px*1.8, rw = iw - px*3.6;
    g.fillStyle = '#000000';
    g.fillRect(rvx, rvy, px, px);
    g.fillRect(rvx + rw - px, rvy, px, px);
    g.fillRect(rvx, rvy + rw - px, px, px);
    g.fillRect(rvx + rw - px, rvy + rw - px, px, px);
    g.fillStyle = 'rgba(255,255,255,0.85)';
    g.fillRect(rvx, rvy, Math.max(1, px*0.5), Math.max(1, px*0.5));
    g.fillRect(rvx + rw - px, rvy, Math.max(1, px*0.5), Math.max(1, px*0.5));

    // Center pixel glint
    g.fillStyle = 'rgba(255,255,255,0.92)';
    g.fillRect(pad + iw*0.5 - px, pad + iw*0.5 - px, px*1.4, px*1.4);
  } else if (style === 'blocker'){
    const gr = g.createLinearGradient(0,pad,0,s-pad);
    gr.addColorStop(0, top); gr.addColorStop(1, bot);
    g.fillStyle = gr; rr(g,pad,pad,iw,iw,r); g.fill();
    g.save(); rr(g,pad,pad,iw,iw,r); g.clip();
    g.strokeStyle='rgba(255,255,255,0.16)'; g.lineWidth=Math.max(1.2,s*0.05);
    for(let i=-s;i<s*2;i+=Math.max(5,s*0.22)){ g.beginPath(); g.moveTo(i,0); g.lineTo(i+s,s); g.stroke(); }
    g.restore();
    g.strokeStyle='rgba(0,0,0,0.45)'; g.lineWidth=Math.max(1,s*0.025);
    rr(g,pad,pad,iw,iw,r); g.stroke();
  } else {
    const jr = Math.max(3, s * 0.38);
    g.fillStyle = bot; rr(g, pad, pad, iw, iw, jr); g.fill();
    g.fillStyle = top; rr(g, pad, pad, iw, iw*0.6, jr); g.fill();
  }

  // target marker — shape-based distinction, independent of color
  if (kind === 'target'){
    g.fillStyle='rgba(255,255,255,0.95)';
    g.beginPath(); g.arc(s/2, s/2, s*0.12, 0, Math.PI*2); g.fill();
    g.strokeStyle='rgba(255,255,255,0.75)'; g.lineWidth=Math.max(1.2,s*0.038);
    g.beginPath(); g.arc(s/2, s/2, s*0.25, 0, Math.PI*2); g.stroke();
  }
  spriteCache.set(key, cnv);
  return cnv;
}

// deterministic variant per cell (never touches the RNG)
// COLOR BELONGS TO THE BLOCK, not to the cell.
// Color used to derive from cell coordinates: a single L piece could come out multi-colored,
// the board looked speckled and it suggested "is there color matching here?".
// Color now comes from board.piece (assigned in the tray) — every cell of a block shares one
// color, and different blocks get different colors.
function variantOf(x,y){
  // color no stamped on the cell: the color you saw in the tray stays the same on the board
  const c = (st && st.board.piece) ? st.board.piece[y*GRID_W+x] : 0;
  if (c) return (c-1) % T.blocks.length;
  // no color assigned (level mode, the board's starting blocks) → coordinate-based spread
  let h=(x*73856093)^(y*19349663); h=(h^(h>>>13))>>>0; return h % T.blocks.length;
}
// Tray / dragged / ghost piece: core already assigned the color, just show the same one
const slotVariant = i => (st && st.trayColor) ? st.trayColor[i] % T.blocks.length : 0;

let bgCache = null;
function drawBackground(){
  if (!bgCache || bgCache.width !== Math.round(W*DPR) || bgCache.dataset.t !== T.name){
    const cnv=document.createElement('canvas');
    cnv.width=Math.round(W*DPR); cnv.height=Math.round(H*DPR); cnv.dataset.t=T.name;
    const g=cnv.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
    const gr=g.createLinearGradient(0,0,0,H);
    gr.addColorStop(0,T.bgTop); gr.addColorStop(0.5,T.bgMid); gr.addColorStop(1,T.bgBot);
    g.fillStyle=gr; g.fillRect(0,0,W,H);

    if (T.style==='pixel'){
      g.strokeStyle='rgba(255,255,255,0.03)'; g.lineWidth=1;
      for(let y=0;y<H;y+=4){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
      const dotCell = 24;
      g.fillStyle='rgba(255,255,255,0.04)';
      for(let x=dotCell/2;x<W;x+=dotCell){
        for(let y=dotCell/2;y<H;y+=dotCell){
          g.fillRect(x,y,1.5,1.5);
        }
      }
    } else if (T.style==='gem'){
      for(let i=0;i<28;i++){
        const x=(i*197)%W, y=(i*113)%H, r=((i*11)%7)/7*1.8+0.5;
        g.globalAlpha=0.08+((i*7)%10)/120;
        g.fillStyle='#C4B5FD'; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
      }
      g.globalAlpha=1;
      const gl=g.createRadialGradient(W*0.65,H*0.25,0,W*0.65,H*0.25,Math.max(W,H)*0.6);
      gl.addColorStop(0,'rgba(56,189,248,0.18)'); gl.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gl; g.fillRect(0,0,W,H);
    } else if (T.style==='candy'){
      for(let i=0;i<70;i++){
        const x=(i*163)%W, y=(i*89)%H, r=((i*17)%12)+2;
        g.globalAlpha=0.04+((i*5)%10)/180;
        g.fillStyle='#F472B6'; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
      }
      g.globalAlpha=1;
      const gl=g.createRadialGradient(W*0.35,H*0.3,0,W*0.35,H*0.3,Math.max(W,H)*0.55);
      gl.addColorStop(0,'rgba(244,63,94,0.16)'); gl.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gl; g.fillRect(0,0,W,H);
    } else if (T.style==='marshmallow'){
      for(let i=0;i<50;i++){
        const x=(i*211)%W, y=(i*131)%H, r=((i*19)%16)+6;
        g.globalAlpha=0.03+((i*9)%10)/200;
        g.fillStyle='#93C5FD'; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
      }
      g.globalAlpha=1;
      const gl=g.createRadialGradient(W/2,H*0.35,0,W/2,H*0.35,Math.max(W,H)*0.5);
      gl.addColorStop(0,'rgba(249,168,212,0.14)'); gl.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gl; g.fillRect(0,0,W,H);
    } else { // jelly / slime
      for(let i=0;i<18;i++){
        const x=(i*173)%W, y=(i*97)%H, r=((i*13)%8)+1.5;
        g.globalAlpha=0.025+((i*7)%10)/400;
        g.fillStyle='#2DD4BF'; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
      }
      g.globalAlpha=1;
      const gl=g.createRadialGradient(W/2,H*0.4,0,W/2,H*0.4,Math.max(W,H)*0.55);
      gl.addColorStop(0,'rgba(96,219,196,0.07)'); gl.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gl; g.fillRect(0,0,W,H);
    }
    const v=g.createRadialGradient(W/2,H/2,Math.min(W,H)*0.28,W/2,H/2,Math.max(W,H)*0.78);
    v.addColorStop(0,'rgba(0,0,0,0)');
    v.addColorStop(1, T.dark ? 'rgba(0,0,0,0.55)' : 'rgba(90,70,45,0.22)');
    g.fillStyle=v; g.fillRect(0,0,W,H);
    bgCache=cnv;
  }
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(bgCache,0,0); ctx.restore();
}

// ─── game/layout.js ───────────────────────────────────────────
// Screen layout: board / tray / HUD boxes for portrait and landscape.
// Single source — drawing and input read the same L object, so coordinate math lives in one place.

// ------------------------------------------------------------- layout
let L = {};
function layout(){
  const portrait = H / W >= 1.05;
  const pad = Math.round(Math.min(W,H)*0.03);
  if (portrait){
    const topH = Math.round(Math.min(56, H*0.068));
    const goalH = Math.round(Math.min(54, H*0.062));
    const botH = Math.round(Math.min(50, H*0.058));
    const avail = H - topH - goalH - botH - pad*2;
    let board = Math.min(W - pad*2 - 16, avail*0.66);
    board = Math.floor(board/GRID_W)*GRID_W;
    let trayH = Math.min(Math.max(avail - board - pad*2, 78), board*0.55);
    const left = Math.max(0, avail - board - trayH - pad*2);
    const boardY = topH + goalH + pad*0.7 + left*0.24;
    L = { portrait:true, pad, topH, goalH, botH, cell: board/GRID_W,
      board:{x:(W-board)/2, y:boardY, s:board},
      tray:{x:pad, y:boardY+board+pad+left*0.48, w:W-pad*2, h:trayH},
      hud:{x:0,y:H-botH,w:W,h:botH} };
  } else {
    const topH = Math.round(Math.min(54, H*0.10));
    const avail = H - topH - pad*2;
    let board = Math.min(avail, W*0.46);
    board = Math.floor(board/GRID_W)*GRID_W;
    const side = (W - board)/2;
    L = { portrait:false, pad, topH, goalH:0, botH:0, cell: board/GRID_W,
      board:{x:(W-board)/2, y:topH+(avail-board)/2+pad, s:board},
      left:{x:pad, y:topH+pad, w:side-pad*2, h:avail},
      tray:{x:W-side+pad*0.5, y:topH+pad, w:side-pad*1.5, h:avail},
      hud:null };
  }
}


// ─── game/state.js ────────────────────────────────────────────
// Game state, onboarding hints and the effect system.
// Juice design: a blast is ANTICIPATION + RELEASE — charge, hit-stop (freeze), impact (punch).

// ------------------------------------------------------------- state
let scene = 'MENU';
let st = null, level = null, levels = LEVELS.levels;
let fx = [], shake = 0, lockUntil = 0, now = 0;
let drag = null, ghost = null, preview = null;
let overlay = null, overlayAt = 0;
// Bumped whenever a run/level starts. The end-of-run overlay is shown by a delayed timer that
// cannot be cancelled from here, so it carries this token and gives up if a new run began
// first — otherwise it lands on the fresh board as a phantom "No room left".
let overlayToken = 0;
let trayAnim = 0, lastStars = 0, settingsOpen = false;
let runMode = false, flash = null, blastFlash = 0;

// --- onboarding: each hint on first encounter. Let the game explain itself.
let hint = null;
// Only i18n KEYS live here — the text is resolved at draw time, so switching language mid-run
// updates a banner that is already on screen. (These used to be English literals: the
// translations existed in i18n.js from the start, they were simply never wired up.)
const HINTS = {
  painter: { c:()=>PAINT_C,  t:'hintPainterT', s:'hintPainterS' },
  magnet:  { c:()=>MAGNET_C, t:'hintMagnetT',  s:'hintMagnetS'  },
  blast:   { c:()=>PAINT_C,  t:'hintBlastT',   s:'hintBlastS'   },
  expire:  { c:()=>C.err,    t:'hintExpireT',  s:'hintExpireS'  },
  multi:   { c:()=>C.accent, t:'hintMultiT',   s:'hintMultiS'   },
};
// A single showing was not enough ("the power blocks do not explain themselves") — show 3 times.
const HINT_TIMES = 3;
function showHint(key){
  if (!runMode) return;
  const seen = SAVE.hints[key]|0;
  if (seen >= HINT_TIMES) return;
  if (hint && hint.key === key) return;          // do not retrigger while the same hint is up
  SAVE.hints[key] = seen+1; writeSave(SAVE);
  hint = { key, t:0, dur:4200 };
}

function unlocked(id){ return id === 1 || SAVE.unlockAll === true || !!SAVE.levels[id-1]; }

// THE LAB. The experimental mode may flip balance dials at runtime, so a change can be FELT instead
// of only measured by tools/ab.mjs. POWER_CFG is global, so the only safe shape is: snapshot on the
// way in, restore on the way out, and have a test prove the restore happens. If it were ever missed
// the main game would quietly run with experimental dials and every later measurement would be
// wrong — which is exactly the failure `tools/smoke.mjs` asserts against.
let labSnapshot = null;
function labEnter(){ if (!labSnapshot) labSnapshot = { ...POWER_CFG }; }
function labRestore(){
  if (!labSnapshot) return;
  Object.assign(POWER_CFG, labSnapshot);
  labSnapshot = null;
}

// opts.regionFree starts the experimental free-3×3 mode. Retry keeps whatever mode you were in,
// which is why the flag is read back off the board rather than stored in a second place.
function startRun(opts = {}){
  if (opts.regionFree) labEnter(); else labRestore();
  const seed = (Date.now() ^ (SAVE.runs||0)*2654435761) >>> 0;
  SAVE.runs = (SAVE.runs||0)+1; writeSave(SAVE);
  level = { id:0, name:'Power Jam', par:0 };
  st = newRun(seed, opts);
  runMode = true; fx=[]; shake=0; drag=null; ghost=null; preview=null;
  overlay=null; overlayToken++; trayAnim=1; flash=null; blastFlash=0;
  scene='PLAY'; lockUntil=0;
}

function startLevel(lv){
  labRestore();                          // level mode never runs experimental dials
  level = lv; st = newGame(lv); runMode = false;
  flash=null; blastFlash=0;
  fx=[]; shake=0; drag=null; ghost=null; preview=null; overlay=null; overlayToken++; trayAnim=1;
  scene='PLAY'; lockUntil=0;
}

// ------------------------------------------------------------- effects
// Juice design: a blast is ANTICIPATION + RELEASE. An instant blast reads as "something
// happened, I guess". Order: charge (cells light up in sequence) → hit-stop (time freezes) → blast.
let freeze = 0;     // remaining hit-stop (ms) — no effect advances while this is running
let punch = 0;      // screen zoom impact, 0..1

// A single move can fire several banners at once — a clear, a synergy pull, paint expiring.
// They were all drawn at nearly the same spot and turned into an unreadable pile at exactly
// the loudest moment of the game. Each one now claims its own row, and only the newest three
// stay alive: past that the screen is noise, not juice.
let hintRect = null;                      // last drawn onboarding banner, for the layout test
const FX_STACK = 3;
function addFx(o){
  o.t = 0;
  if (o.kind === 'combo'){
    const live = fx.filter(f => f.kind === 'combo');
    while (live.length >= FX_STACK) fx.splice(fx.indexOf(live.shift()), 1);
    o.slot = live.length;
  }
  fx.push(o);
}
function updateFx(dt){
  if (freeze > 0){ freeze -= dt; return; }   // hit-stop: everything freezes, the hit gains weight
  for (let i=fx.length-1;i>=0;i--){
    const f=fx[i]; f.t+=dt;
    if (f.t>=f.dur) fx.splice(i,1);
  }
  if (punch>0) punch=Math.max(0, punch-dt/260);
  if (shake>0) shake=Math.max(0, shake-dt*0.012);
  if (trayAnim>0) trayAnim=Math.max(0, trayAnim-dt/200);
  if (blastFlash>0) blastFlash=Math.max(0, blastFlash-dt/700);
  if (hint){ hint.t+=dt; if (hint.t>=hint.dur) hint=null; }
  // show the hint when a power first appears in the tray (must be seen BEFORE placing)
  if (runMode && st && st.phase==='PLAYING'){
    if (st.trayPower.includes('PAINTER')) showHint('painter');
    else if (st.trayPower.includes('MAGNET')) showHint('magnet');
  }
  if (flash){ flash.t+=dt; if(flash.t>=flash.dur) flash=null; }
}
function spawnParticles(cx,cy,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=0.04+Math.random()*0.10;
    addFx({kind:'p',dur:420+Math.random()*220,x:cx,y:cy,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-0.06,color,
      sz:L.cell*(0.08+Math.random()*0.08)});
  }
}

// ─── game/sfx.js ──────────────────────────────────────────────
// Sound is entirely synthetic: WebAudio oscillators, not a single audio file.
// The blast pitch rises as the streak grows.

// ------------------------------------------------------------- sound (synthetic)
let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
document.addEventListener('pointerdown',()=>{ const a=ac(); if(a&&a.state==='suspended') a.resume(); },{once:true});
let muted=false;
function soundOn(){ return SAVE.settings.sound && !muted; }
function tone(freq,dur,type,vol,slide){
  const a=ac(); if(!a||!soundOn()) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,a.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+dur);
  g.gain.setValueAtTime(0.0001,a.currentTime);
  g.gain.exponentialRampToValueAtTime(vol||0.12,a.currentTime+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+0.02);
}
function sfx(kind,combo){
  if(kind==='pickup') tone(280+Math.random()*30,0.07,'sine',0.08,440);
  else if(kind==='place') tone(180+Math.random()*40,0.09,'triangle',0.10,110);
  else if(kind==='clear'){ const semi=Math.min(combo||1,8)-1;
    const base=520*Math.pow(2,semi/12);
    tone(base,0.16,'sine',0.14); setTimeout(()=>tone(base*1.5,0.14,'sine',0.09),55); }
  else if(kind==='paint'){ tone(440,0.22,'sine',0.10,880); setTimeout(()=>tone(660,0.16,'triangle',0.07),90); }
  else if(kind==='magnet'){ tone(900,0.20,'sine',0.09,300); setTimeout(()=>tone(300,0.14,'triangle',0.07),110); }
  // charge: rising tension — announces that a blast is coming
  else if(kind==='charge'){ tone(220,0.26,'sawtooth',0.055,760);
    [0,90,180].forEach((d,i)=>setTimeout(()=>tone(520*Math.pow(2,i/12),0.10,'sine',0.05),d)); }
  // pitch rises with the streak — the ear hears "it happened again, and bigger"
  else if(kind==='blast'){ const s=Math.min(combo||1,8), up=Math.pow(2,(s-1)*2/12);
    tone(150*up,0.40,'square',0.16,50*up);
    tone(90*up,0.34,'sawtooth',0.12,40*up);
    [740,980,1240,1560].forEach((f,i)=>setTimeout(()=>tone(f*up,0.20,'sine',0.13),50+i*65));
    if (s>2) setTimeout(()=>[1960,2340].forEach((f,i)=>setTimeout(()=>tone(f*up,0.16,'sine',0.10),i*70)),300); }
  else if(kind==='reward'){ [392,523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.22,'triangle',0.13),i*70));
    setTimeout(()=>tone(1568,0.30,'sine',0.11),380); }
  else if(kind==='synergy'){ [520,780,1040].forEach((f,i)=>setTimeout(()=>tone(f,0.16,'triangle',0.11),i*55));
    setTimeout(()=>tone(1560,0.22,'sine',0.09),170); }
  else if(kind==='fizzle'){ tone(420,0.30,'triangle',0.08,120); }
  else if(kind==='win'){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.20,'sine',0.13),i*95)); }
}


// ─── game/render.js ───────────────────────────────────────────
// Drawing of the board, tray, dragged piece and power previews.
// Everything here is pure rendering: it reads game state and never mutates it.

// ------------------------------------------------------------- drawing
function cellRect(x,y){ return { x:L.board.x+x*L.cell, y:L.board.y+y*L.cell, s:L.cell }; }

function drawBoardFrame(){
  const b=L.board, m=L.cell*0.30;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.35)';
  const cr = T.style === 'pixel' ? 4 : (T.style === 'gem' ? L.cell*0.18 : L.cell*0.30);
  rr(ctx,b.x-m+3,b.y-m+5,b.s+m*2,b.s+m*2,cr); ctx.fill();
  const g=ctx.createLinearGradient(0,b.y-m,0,b.y+b.s+m);
  g.addColorStop(0,T.frameA); g.addColorStop(1,T.frameB);
  ctx.fillStyle=g; rr(ctx,b.x-m,b.y-m,b.s+m*2,b.s+m*2,cr); ctx.fill();

  if (T.style === 'pixel'){
    // Retro Arcade Cabinet Frame: dark pixel border with corner accent brackets
    ctx.strokeStyle='#000000'; ctx.lineWidth=3;
    rr(ctx,b.x-m,b.y-m,b.s+m*2,b.s+m*2,2); ctx.stroke();
    const bsz = L.cell * 0.35;
    ctx.fillStyle = T.accent;
    ctx.fillRect(b.x-m, b.y-m, bsz, 4);
    ctx.fillRect(b.x-m, b.y-m, 4, bsz);
    ctx.fillRect(b.x+b.s+m-bsz, b.y-m, bsz, 4);
    ctx.fillRect(b.x+b.s+m-4, b.y-m, 4, bsz);
    ctx.fillRect(b.x-m, b.y+b.s+m-4, bsz, 4);
    ctx.fillRect(b.x-m, b.y+b.s+m-bsz, 4, bsz);
    ctx.fillRect(b.x+b.s+m-bsz, b.y+b.s+m-4, bsz, 4);
    ctx.fillRect(b.x+b.s+m-4, b.y+b.s+m-bsz, 4, bsz);
  } else if (T.style === 'gem'){
    // Jewel Box: Metallic gold/silver beveled frame
    ctx.strokeStyle='rgba(255,255,255,0.30)'; ctx.lineWidth=2;
    rr(ctx,b.x-m,b.y-m,b.s+m*2,b.s+m*2,cr); ctx.stroke();
    ctx.strokeStyle='rgba(56,189,248,0.35)'; ctx.lineWidth=1;
    rr(ctx,b.x-m+3,b.y-m+3,b.s+m*2-6,b.s+m*2-6,cr*0.8); ctx.stroke();
  } else if (T.style === 'candy'){
    // Sweet Candy Box: Glossy pastel rim
    ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=2.5;
    rr(ctx,b.x-m,b.y-m,b.s+m*2,b.s+m*2,cr); ctx.stroke();
  } else if (T.style === 'marshmallow'){
    // Fluffy Pillow Board: Soft quilted border
    ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=2;
    rr(ctx,b.x-m,b.y-m,b.s+m*2,b.s+m*2,cr); ctx.stroke();
  } else {
    // Slime: Gooey translucent rim
    ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=2;
    rr(ctx,b.x-m,b.y-m,b.s+m*2,b.s+m*2,cr); ctx.stroke();
  }

  ctx.fillStyle=T.inner; rr(ctx,b.x-2,b.y-2,b.s+4,b.s+4,T.style==='pixel'?2:L.cell*0.10); ctx.fill();
  ctx.restore();
}

// Draw order matters: base → highlights → blocks → effects → ghost → top layer.
// Each part has its own function; they all work off the shared bd (board) and pullOffset.
function drawCells(){
  const bd = st.board;
  // Magnet pull: the cell already sits at its destination but is drawn sliding in from its old
  // spot. If it teleports the player cannot read what happened and misses the synergy (spec §3).
  const pull = fx.find(f=>f.kind==='pull');
  const pullOffset = (x,y) => {
    if (!pull) return null;
    const m = pull.moves.find(mv=>mv.to[0]===x && mv.to[1]===y);
    if (!m) return null;
    const e = 1-Math.pow(1-Math.min(1,pull.t/pull.dur),3);
    return { dx:(m.from[0]-x)*L.cell*(1-e), dy:(m.from[1]-y)*L.cell*(1-e), painted:m.painted };
  };

  drawEmptyCells();
  drawRegionGrid();
  drawClearPreview(bd);
  drawBlocks(bd, pullOffset);
  drawBlastFx();
  drawMagnetLinks(pull, pullOffset);
  drawClearFx();
  drawGhostAndPowerPreview(bd);
  drawPaintedCells(bd, pullOffset);
  drawParticles();
}

// 3×3 region borders — like the thick lines in Sudoku.
// The region rule is only playable if regions are VISIBLE; otherwise the player cannot tell
// what they are filling.
function drawRegionGrid(){
  if (!REGION) return;
  // In the free-3×3 mode every boundary is equally a region edge, so thick lines on 3 and 6 would
  // claim alignment matters when it does not. The uniform cell grid is then the honest picture.
  if (st.board.regionFree) return;
  const b = L.board;
  ctx.save();
  ctx.strokeStyle = T.dark ? 'rgba(255,255,255,0.16)' : 'rgba(0,0,0,0.18)';
  ctx.lineWidth = Math.max(1.5, L.cell*0.055);
  for (let i = REGION; i < GRID_W; i += REGION){
    ctx.beginPath(); ctx.moveTo(b.x + i*L.cell, b.y); ctx.lineTo(b.x + i*L.cell, b.y + b.s); ctx.stroke();
  }
  for (let i = REGION; i < GRID_H; i += REGION){
    ctx.beginPath(); ctx.moveTo(b.x, b.y + i*L.cell); ctx.lineTo(b.x + b.s, b.y + i*L.cell); ctx.stroke();
  }
  ctx.restore();
}

function drawEmptyCells(){
  for(let y=0;y<GRID_H;y++) for(let x=0;x<GRID_W;x++){
    const r=cellRect(x,y), i=L.cell*0.055;
    const w = r.s - i*2;
    if (T.style === 'pixel'){
      ctx.fillStyle = C.empty; ctx.fillRect(r.x+i, r.y+i, w, w);
      ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
      ctx.strokeRect(r.x+i, r.y+i, w, w);
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(r.x+r.s/2-1, r.y+r.s/2-1, 2, 2);
    } else if (T.style === 'gem'){
      const c = w * 0.22;
      const pts = [
        [r.x+i+c, r.y+i], [r.x+i+w-c, r.y+i],
        [r.x+i+w, r.y+i+c], [r.x+i+w, r.y+i+w-c],
        [r.x+i+w-c, r.y+i+w], [r.x+i+c, r.y+i+w],
        [r.x+i, r.y+i+w-c], [r.x+i, r.y+i+c]
      ];
      ctx.fillStyle = C.empty; poly(ctx, pts); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
      poly(ctx, pts); ctx.stroke();
    } else if (T.style === 'marshmallow'){
      ctx.fillStyle = C.empty; rr(ctx, r.x+i, r.y+i, w, w, L.cell*0.28); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
      rr(ctx, r.x+i, r.y+i, w, w, L.cell*0.28); ctx.stroke();
    } else if (T.style === 'candy'){
      ctx.fillStyle = C.empty; rr(ctx, r.x+i, r.y+i, w, w, L.cell*0.24); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
      rr(ctx, r.x+i, r.y+i, w, w, L.cell*0.24); ctx.stroke();
    } else {
      ctx.fillStyle = C.empty; rr(ctx, r.x+i, r.y+i, w, w, L.cell*0.18); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1;
      rr(ctx, r.x+i, r.y+i, w, w, L.cell*0.18); ctx.stroke();
    }
  }
}

function drawClearPreview(bd){
  if (preview && preview.n>0){
    // will this move TRIGGER a mass blast? The player must see it before dropping —
    // otherwise they complete the setup by accident and never notice the mechanic.
    const inPrevRegion = (px,py) => (preview.regions||[]).some(([bx,by]) =>
      px>=bx && px<bx+REGION && py>=by && py<by+REGION);
    const inPrev = (px,py) => preview.rows.includes(py) || preview.cols.includes(px) || inPrevRegion(px,py);
    const willBlast = runMode && st.painter && st.painter.painted.some(([px,py]) => inPrev(px,py));

    // THE INVERSE SIGNAL. When the paint list is at its cap, cells placed inside the Painter's
    // radius are NOT painted, so completing their line clears normally and does NOT blast. The
    // player has done everything right and gets nothing, with no explanation — measured on 34-42%
    // of blasts. This detects exactly that case: a move that WOULD have blasted if there had been
    // room. Anything else (a line with no paint in it, nowhere near the Painter) is an ordinary
    // clear and gets no warning, or the warning would become noise.
    let capBlocked = false;
    if (runMode && st.painter && !willBlast && drag && ghost && ghost.ok){
      const cap = POWER_CFG.paintLimit + st.paintBonus;
      if (st.painter.painted.length >= cap){
        const p = PIECES[st.tray[drag.ti]], r = POWER_CFG.paintRadius;
        capBlocked = p.cells.some(([dx,dy]) => {
          const cx = ghost.x+dx, cy = ghost.y+dy;
          const near = st.painter.cells.some(([mx,my]) =>
            Math.max(Math.abs(cx-mx), Math.abs(cy-my)) <= r);
          return near && inPrev(cx,cy);
        });
      }
    }

    ctx.save();
    ctx.fillStyle = willBlast ? PAINT_C+'44' : (capBlocked ? C.err+'33' : T.accent+'33');
    for(const y of preview.rows) ctx.fillRect(L.board.x,L.board.y+y*L.cell,L.board.s,L.cell);
    for(const x of preview.cols) ctx.fillRect(L.board.x+x*L.cell,L.board.y,L.cell,L.board.s);
    for(const [bx,by] of preview.regions||[])
      ctx.fillRect(L.board.x+bx*L.cell, L.board.y+by*L.cell, REGION*L.cell, REGION*L.cell);
    ctx.restore();
    if (willBlast){
      const pulse=0.5+0.5*Math.sin(now/90);
      // mark each painted cell that is about to blast
      ctx.save();
      ctx.strokeStyle='#FFFFFF'; ctx.shadowColor=PAINT_C;
      for (const [px,py] of st.painter.painted){
        if (!((bd.painted[py]>>px)&1)) continue;
        const r=cellRect(px,py);
        ctx.globalAlpha=0.55+0.45*pulse;
        ctx.shadowBlur=L.cell*(0.2+0.4*pulse);
        ctx.lineWidth=Math.max(2,L.cell*0.09);
        rr(ctx,r.x+2,r.y+2,r.s-4,r.s-4,L.cell*0.18); ctx.stroke();
      }
      ctx.restore();
      const n=st.painter.painted.length;
      const bw2=Math.min(230,L.board.s*0.8), bh2=30, bx2=L.board.x+(L.board.s-bw2)/2;
      const by2=L.board.y+L.board.s+6;
      ctx.save(); ctx.globalAlpha=0.9+0.1*pulse;
      ctx.fillStyle=PAINT_C; rr(ctx,bx2,by2,bw2,bh2,15); ctx.fill(); ctx.restore();
      txt(S('willBlast', {n, mult: st.comboMult.toFixed(1)}),
          bx2+bw2/2, by2+bh2/2, 13, '#241C17','center','800');
    } else if (capBlocked){
      // Same pill, same place, opposite message — so the two read as a pair rather than as two
      // unrelated pieces of UI. The player learns the rule from the contrast.
      const pulse=0.5+0.5*Math.sin(now/140);
      const bw2=Math.min(230,L.board.s*0.8), bh2=30, bx2=L.board.x+(L.board.s-bw2)/2;
      const by2=L.board.y+L.board.s+6;
      ctx.save(); ctx.globalAlpha=0.85+0.15*pulse;
      ctx.fillStyle=C.err; rr(ctx,bx2,by2,bw2,bh2,15); ctx.fill(); ctx.restore();
      txt(S('capBlocked', {cap: POWER_CFG.paintLimit + st.paintBonus}),
          bx2+bw2/2, by2+bh2/2, 13, '#FFFFFF','center','800');
    }
  }
}

function drawBlocks(bd, pullOffset){
  for(let y=0;y<GRID_H;y++) for(let x=0;x<GRID_W;x++){
    const r=cellRect(x,y);
    if ((bd.blockers[y]>>x)&1){ ctx.drawImage(blockSprite(L.cell,'blocker',0), r.x,r.y,r.s,r.s); continue; }
    if (!((bd.rows[y]>>x)&1)) continue;
    const isT=((bd.targets[y]>>x)&1)!==0;
    let scX=1, scY=1;
    const pa=fx.find(f=>f.kind==='place'&&f.cells.some(c=>c[0]===x&&c[1]===y));
    if (pa){
      const k=Math.min(1,pa.t/420);
      if (T.style==='jelly'||T.style==='marshmallow'||T.style==='candy'){
        // Contact squash first, then a damped rebound: the release has immediate weight.
        const w = Math.cos(k * Math.PI * 4) * Math.exp(-k * 5) * (1-k);
        scX = 1 + 0.18 * w;
        scY = 1 - 0.22 * w;
      } else {
        const sc=0.72+0.28*(1-Math.pow(1-k,3));
        scX=sc; scY=sc;
      }
    }
    const isBroken = ((bd.broken[y]>>x)&1)!==0;
    if (isBroken){ scX*=0.82; scY*=0.82; }
    const po=pullOffset(x,y), mx=po?po.dx:0, my=po?po.dy:0;
    const szX=r.s*scX, szY=r.s*scY;
    const offX=(r.s-szX)/2, offY=(r.s-szY)/2;
    ctx.drawImage(blockSprite(L.cell,isT?'target':'wood',variantOf(x,y)), r.x+offX+mx,r.y+offY+my,szX,szY);
    if (isBroken){
      ctx.save(); ctx.globalAlpha=0.5; ctx.strokeStyle= T.dark?'#000':'#3A2F28';
      ctx.lineWidth=Math.max(1,L.cell*0.05); ctx.setLineDash([L.cell*0.14,L.cell*0.10]);
      rr(ctx,r.x+offX+mx,r.y+offY+my,szX,szY,L.cell*0.16); ctx.stroke(); ctx.restore();
    }
  }
}

function drawBlastFx(){
  // MASS BLAST: charge (cells light up in sequence, chained together) → release
  const bl = fx.find(f=>f.kind==='blast');
  if (bl){
    const n = bl.cells.length;
    for (let i=0;i<n;i++){
      const [x,y] = bl.cells[i], r = cellRect(x,y);
      const lead = bl.charge * 0.55 * (i/Math.max(1,n-1));   // domino delay
      const ct = bl.t - lead;
      if (bl.t < bl.charge){
        if (ct < 0) {   // not its turn yet — waits in its painted state
          ctx.save(); ctx.globalAlpha=0.9; ctx.fillStyle=PAINT_C;
          rr(ctx,r.x+2,r.y+2,r.s-4,r.s-4,L.cell*0.18); ctx.fill(); ctx.restore();
          continue;
        }
        const k = Math.min(1, ct/(bl.charge*0.45));
        const sc = 1 + 0.30*Math.sin(k*Math.PI);            // swells
        const sz = r.s*sc, off=(r.s-sz)/2;
        ctx.save();
        ctx.shadowColor=PAINT_C; ctx.shadowBlur=L.cell*(0.3+1.1*k);
        ctx.fillStyle = k>0.7 ? '#FFFFFF' : PAINT_C;
        rr(ctx,r.x+off,r.y+off,sz,sz,L.cell*0.18); ctx.fill();
        ctx.restore();
      } else {
        const k=(bl.t-bl.charge)/(bl.dur-bl.charge);
        const sz=r.s*(1+0.5*k), off=(r.s-sz)/2;
        ctx.save(); ctx.globalAlpha=Math.max(0,1-k*1.6);
        ctx.fillStyle='#FFFFFF';
        rr(ctx,r.x+off,r.y+off,sz,sz,L.cell*0.2); ctx.fill(); ctx.restore();
      }
    }
    // chain lines: as if the cells were wiring themselves together
    if (bl.t < bl.charge && n>1){
      ctx.save(); ctx.globalAlpha=0.5*(bl.t/bl.charge); ctx.strokeStyle=PAINT_C;
      ctx.lineWidth=Math.max(1.5,L.cell*0.06); ctx.beginPath();
      for (let i=0;i<n;i++){
        const [x,y]=bl.cells[i], r=cellRect(x,y);
        i ? ctx.lineTo(r.x+r.s/2,r.y+r.s/2) : ctx.moveTo(r.x+r.s/2,r.y+r.s/2);
      }
      ctx.stroke(); ctx.restore();
    }
  }

}

function drawMagnetLinks(pull, pullOffset){
  // Magnet → painted cell link: make "these two worked together" visible
  if (pull && pull.mag){
    const k = Math.min(1, pull.t/pull.dur);
    ctx.save();
    ctx.globalAlpha = (1-k)*0.85;
    ctx.lineCap='round';
    for (const m of pull.moves){
      const mc = pull.mag.reduce((best,c)=>{
        const d=Math.abs(c[0]-m.to[0])+Math.abs(c[1]-m.to[1]);
        return (!best||d<best.d)?{c,d}:best;
      },null).c;
      const a = cellRect(mc[0],mc[1]), b2 = cellRect(m.to[0],m.to[1]);
      const po = pullOffset(m.to[0],m.to[1]);
      const bx2=b2.x+b2.s/2+(po?po.dx:0), by2=b2.y+b2.s/2+(po?po.dy:0);
      ctx.strokeStyle = m.painted ? PAINT_C : MAGNET_C;
      ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = L.cell*0.35;
      ctx.lineWidth = Math.max(2, L.cell*(m.painted?0.10:0.06));
      ctx.beginPath(); ctx.moveTo(a.x+a.s/2, a.y+a.s/2); ctx.lineTo(bx2, by2); ctx.stroke();
    }
    ctx.restore();
  }

}

function drawClearFx(){
  const clearing = fx.find(f=>f.kind==='clear');
  // clear animation
  if (clearing){
    const k = clearing.t / clearing.dur;
    const usePhysics = typeof SAVE !== 'undefined' && SAVE.settings && SAVE.settings.popPhysics !== false;
    for (let i = 0; i < clearing.cells.length; i++){
      const [x,y] = clearing.cells[i];
      const r = cellRect(x,y);
      if (k < 0.20){
        ctx.save(); ctx.globalAlpha = 1 - k/0.20; ctx.fillStyle = T.dark ? '#FFFFFF' : '#2B2B33';
        const sc = 1 + 0.15 * (k/0.20);
        const sz = r.s * sc, o = (r.s - sz)/2;
        rr(ctx, r.x+o, r.y+o, sz, sz, L.cell*0.20); ctx.fill(); ctx.restore();
      } else {
        const q = (k - 0.20) / 0.80;
        if (usePhysics){
          const seed = (x * 19 + y * 37 + i * 11);
          const angle = ((seed % 360) * Math.PI) / 180;
          const speed = L.cell * (1.1 + (seed % 8) * 0.12);

          if (T.style === 'pixel'){
            // 8-Bit Arcade: Pixel block explodes into 4 mini pixel chunks flying to the 4 corners
            const psz = (r.s * 0.44) * Math.max(0, 1 - q * 0.90);
            const pdist = speed * 1.35 * q;
            const corners = [[-1,-1], [1,-1], [-1,1], [1,1]];
            ctx.save();
            ctx.globalAlpha = Math.max(0, 1 - q * 1.2);
            ctx.fillStyle = T.blocks[variantOf(x,y) % T.blocks.length][0];
            for (const [cdx, cdy] of corners){
              const cpx = r.x + r.s/2 + cdx * (r.s*0.22 + pdist);
              const cpy = r.y + r.s/2 + cdy * (r.s*0.22 + pdist);
              ctx.fillRect(cpx - psz/2, cpy - psz/2, psz, psz);
            }
            ctx.restore();
          } else if (T.style === 'marshmallow'){
            // Marshmallow: Floats gently upward like a sweet soft cloud puff
            const fyOff = -L.cell * 1.5 * q;
            const fxOff = Math.sin(q * Math.PI * 2 + seed) * (L.cell * 0.35) * q;
            const sz = r.s * (1 + 0.22 * Math.sin(q * Math.PI));
            ctx.save();
            ctx.globalAlpha = Math.max(0, (1 - q) * 0.85);
            ctx.translate(r.x + r.s/2 + fxOff, r.y + r.s/2 + fyOff);
            ctx.drawImage(blockSprite(L.cell, 'wood', variantOf(x,y)), -sz/2, -sz/2, sz, sz);
            ctx.restore();
          } else if (T.style === 'gem'){
            // Gem: Rapid crystalline spin with sparkling trajectory
            const fxOff = Math.cos(angle) * speed * 1.2 * q;
            const fyOff = (Math.sin(angle) * speed * 0.6 - L.cell * 1.0) * q + (L.cell * 2.5 * q * q);
            const rot = ((seed % 2 === 0 ? 1 : -1) * 3.6) * q;
            const sz = r.s * Math.max(0, 1 - q * 0.90);
            ctx.save();
            ctx.globalAlpha = Math.max(0, 1 - Math.pow(q, 1.3));
            ctx.translate(r.x + r.s/2 + fxOff, r.y + r.s/2 + fyOff);
            ctx.rotate(rot);
            ctx.drawImage(blockSprite(L.cell, 'wood', variantOf(x,y)), -sz/2, -sz/2, sz, sz);
            ctx.restore();
          } else {
            // Slime & Candy: Juicy parabolic pop fling
            const fxOff = Math.cos(angle) * speed * q;
            const fyOff = (Math.sin(angle) * speed * 0.5 - L.cell * 0.85) * q + (L.cell * 2.2 * q * q);
            const rot = ((seed % 2 === 0 ? 1 : -1) * (1.0 + (seed % 4) * 0.25)) * q;
            const sz = r.s * Math.max(0, 1 - q * 0.92);
            ctx.save();
            ctx.globalAlpha = Math.max(0, 1 - Math.pow(q, 1.4));
            ctx.translate(r.x + r.s/2 + fxOff, r.y + r.s/2 + fyOff);
            ctx.rotate(rot);
            ctx.drawImage(blockSprite(L.cell, 'wood', variantOf(x,y)), -sz/2, -sz/2, sz, sz);
            ctx.restore();
          }
        } else {
          const sz = r.s * (1 - q), o = (r.s - sz)/2;
          ctx.save(); ctx.globalAlpha = 1 - q;
          ctx.drawImage(blockSprite(L.cell, 'wood', variantOf(x,y)), r.x+o, r.y+o, sz, sz);
          ctx.restore();
        }
      }
    }
  }
}

function drawGhostAndPowerPreview(bd){
  // ghost
  if (drag && ghost){
    const p=PIECES[st.tray[drag.ti]];
    ctx.save(); ctx.globalAlpha=ghost.ok?0.40:0.26;
    for(const [dx,dy] of p.cells){
      const r=cellRect(ghost.x+dx,ghost.y+dy);
      if (ghost.ok) ctx.drawImage(blockSprite(L.cell,'wood',slotVariant(drag.ti)), r.x,r.y,r.s,r.s);
      else { ctx.fillStyle=C.err; rr(ctx,r.x+3,r.y+3,r.s-6,r.s-6,L.cell*0.16); ctx.fill(); }
    }
    ctx.restore();

    // POWER PREVIEW — the answer to "the power blocks do not explain themselves":
    // instead of making the player read text, show what it will do on the board before dropping.
    const dpw = runMode ? st.trayPower[drag.ti] : null;
    if (dpw && ghost.ok){
      const pulse=0.5+0.5*Math.sin(now/130);
      const gcells = p.cells.map(([dx,dy])=>[ghost.x+dx, ghost.y+dy]);
      const own = new Set(gcells.map(([x,y])=>y*GRID_W+x));
      ctx.save();
      if (dpw==='PAINTER'){
        // filled cells that will be painted
        const r0=POWER_CFG.paintRadius; let n=0;
        const seen=new Set();
        for (const [cx,cy] of gcells)
          for (let dy=-r0;dy<=r0;dy++) for (let dx=-r0;dx<=r0;dx++){
            const x=cx+dx, y=cy+dy, key=y*GRID_W+x;
            if (x<0||y<0||x>=GRID_W||y>=GRID_H||seen.has(key)) continue;
            if (own.has(key) || !((bd.rows[y]>>x)&1)) continue;
            if (n>=POWER_CFG.paintLimit) continue;
            seen.add(key); n++;
            const r=cellRect(x,y);
            ctx.globalAlpha=0.30+0.25*pulse; ctx.fillStyle=PAINT_C;
            rr(ctx,r.x+2,r.y+2,r.s-4,r.s-4,L.cell*0.18); ctx.fill();
            ctx.globalAlpha=0.9; ctx.strokeStyle=PAINT_C; ctx.lineWidth=Math.max(1.5,L.cell*0.055);
            rr(ctx,r.x+2,r.y+2,r.s-4,r.s-4,L.cell*0.18); ctx.stroke();
          }
        if (n){
          const gr=cellRect(gcells[0][0],gcells[0][1]);
          ctx.globalAlpha=1;
          txt(S('paintsCells', {n}), gr.x+gr.s/2, gr.y-L.cell*0.42, 12, PAINT_C,'center','800');
        }
      } else if (dpw==='MAGNET'){
        // cells that will be pulled, and their directions
        const r0=POWER_CFG.magnetRadius, seen=new Map();
        for (const [mx,my] of gcells)
          for (let dy=-r0;dy<=r0;dy++) for (let dx=-r0;dx<=r0;dx++){
            const x=mx+dx, y=my+dy, key=y*GRID_W+x;
            if (x<0||y<0||x>=GRID_W||y>=GRID_H||own.has(key)) continue;
            if (!((bd.rows[y]>>x)&1)) continue;
            const d=Math.max(Math.abs(dx),Math.abs(dy));
            const pr=seen.get(key);
            if (!pr||d<pr.d) seen.set(key,{x,y,d,mx,my,painted:((bd.painted[y]>>x)&1)===1});
          }
        let list=[...seen.values()];
        if (list.some(c=>c.painted)) list=list.filter(c=>c.painted);
        ctx.lineCap='round';
        for (const c of list){
          const nx=c.x+Math.sign(c.mx-c.x), ny=c.y+Math.sign(c.my-c.y);
          if ((nx===c.x&&ny===c.y) || nx<0||ny<0||nx>=GRID_W||ny>=GRID_H) continue;
          if (((bd.rows[ny]>>nx)&1) || ((bd.blockers[ny]>>nx)&1)) continue;
          const a=cellRect(c.x,c.y), b3=cellRect(nx,ny);
          ctx.globalAlpha=0.55+0.35*pulse;
          ctx.strokeStyle=c.painted?PAINT_C:MAGNET_C; ctx.lineWidth=Math.max(2,L.cell*0.08);
          ctx.beginPath(); ctx.moveTo(a.x+a.s/2,a.y+a.s/2); ctx.lineTo(b3.x+b3.s/2,b3.y+b3.s/2); ctx.stroke();
          ctx.fillStyle=ctx.strokeStyle;
          ctx.beginPath(); ctx.arc(b3.x+b3.s/2,b3.y+b3.s/2,L.cell*0.11,0,Math.PI*2); ctx.fill();
        }
        if (list.length){
          const gr=cellRect(gcells[0][0],gcells[0][1]);
          ctx.globalAlpha=1;
          txt(S('pullsCells', {n: list.length}), gr.x+gr.s/2, gr.y-L.cell*0.42, 12, MAGNET_C,'center','800');
        }
      }
      ctx.restore();
    }
  }
}

function drawPaintedCells(bd, pullOffset){
  // painted cells + Painter timer
  if (runMode && st.painter){
    const P = st.painter;
    const warn = P.remaining <= 2;                       // warn during the last 2 turns
    const pulse = 0.5 + 0.5*Math.sin(now/(warn?110:240));
    // painted cells: color fill + pulse (a "charged" feeling)
    for (const [px,py] of P.painted){
      if (!((bd.painted[py]>>px)&1)) continue;
      const r = cellRect(px,py), po = pullOffset(px,py);
      const mx = po?po.dx:0, my = po?po.dy:0;
      ctx.save();
      ctx.globalAlpha = 0.22 + 0.18*pulse;
      ctx.fillStyle = PAINT_C;
      rr(ctx, r.x+2+mx, r.y+2+my, r.s-4, r.s-4, L.cell*0.18); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.shadowColor = PAINT_C; ctx.shadowBlur = L.cell*(0.18+0.22*pulse);
      ctx.strokeStyle = PAINT_C; ctx.lineWidth = Math.max(2, L.cell*0.07);
      rr(ctx, r.x+2+mx, r.y+2+my, r.s-4, r.s-4, L.cell*0.18); ctx.stroke();
      ctx.restore();
    }
    // timer — on the Painter block's first cell
    const [hx,hy] = P.cells[0];
    const r = cellRect(hx,hy), cx = r.x+r.s/2, cy = r.y+r.s/2;
    ctx.save();
    if (warn) ctx.globalAlpha = 0.45 + 0.55*pulse;
    ctx.fillStyle='rgba(0,0,0,0.62)';
    ctx.beginPath(); ctx.arc(cx,cy,L.cell*0.31,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = warn ? C.err : PAINT_C; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(cx,cy,L.cell*0.31,0,Math.PI*2); ctx.stroke();
    txt(String(P.remaining), cx, cy+L.cell*0.015, L.cell*0.38, '#FFFFFF','center','800');
    ctx.restore();
  }

}

function drawParticles(){
  // particles
  for(const f of fx){ if(f.kind!=='p') continue;
    const k=f.t/f.dur;
    ctx.save(); ctx.globalAlpha=1-k; ctx.fillStyle=f.color;
    const px=f.x+f.vx*f.t, py=f.y+f.vy*f.t+0.00028*f.t*f.t;
    if (T.style === 'pixel'){
      // Chunky 8-bit square pixels
      ctx.fillRect(px, py, f.sz, f.sz);
    } else if (T.style === 'gem'){
      // Diamond star sparkles
      const sr = f.sz * 0.75;
      ctx.beginPath();
      ctx.moveTo(px + sr, py);
      ctx.quadraticCurveTo(px + sr, py + sr, px + sr*2, py + sr);
      ctx.quadraticCurveTo(px + sr, py + sr, px + sr, py + sr*2);
      ctx.quadraticCurveTo(px + sr, py + sr, px, py + sr);
      ctx.quadraticCurveTo(px + sr, py + sr, px + sr, py);
      ctx.fill();
    } else if (T.style === 'candy'){
      // Round colorful sugar confetti
      ctx.beginPath(); ctx.arc(px + f.sz/2, py + f.sz/2, f.sz * 0.5, 0, Math.PI*2); ctx.fill();
    } else if (T.style === 'marshmallow'){
      // Soft puffy cloud puffs
      ctx.globalAlpha = (1 - k) * 0.65;
      ctx.beginPath(); ctx.arc(px + f.sz/2, py + f.sz/2, f.sz * 0.65, 0, Math.PI*2); ctx.fill();
    } else {
      // Slime jelly droplets
      rr(ctx, px, py, f.sz, f.sz, f.sz*0.4); ctx.fill();
    }
    ctx.restore();
  }
}

function drawFlash(){
  if (flash && flash.t >= 0){          // negative t = delayed start (waits until the charge ends)
    const k=flash.t/flash.dur;
    ctx.save(); ctx.globalAlpha=(1-k)*0.55;
    const r=cellRect(flash.x,flash.y);
    const g=ctx.createRadialGradient(r.x+r.s/2,r.y+r.s/2,0,r.x+r.s/2,r.y+r.s/2,L.cell*2.4*(0.5+k));
    g.addColorStop(0,flash.color); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(L.board.x-L.cell,L.board.y-L.cell,L.board.s+L.cell*2,L.board.s+L.cell*2);
    ctx.restore();
  }
  if (blastFlash>0){
    ctx.save(); ctx.globalAlpha=blastFlash*0.35; ctx.strokeStyle=PAINT_C;
    ctx.lineWidth=6; rr(ctx,L.board.x-6,L.board.y-6,L.board.s+12,L.board.s+12,14); ctx.stroke();
    ctx.restore();
  }
}

function traySlots(){
  const t=L.tray, out=[];
  if (L.portrait){ const w=t.w/3; for(let i=0;i<3;i++) out.push({x:t.x+w*i,y:t.y,w,h:t.h}); }
  else { const h=t.h/3; for(let i=0;i<3;i++) out.push({x:t.x,y:t.y+h*i,w:t.w,h}); }
  return out;
}

function drawTray(){
  const slots=traySlots();
  for(let i=0;i<3;i++){
    const s=slots[i], id=st.tray[i];
    ctx.save();
    ctx.fillStyle= T.dark?'rgba(0,0,0,0.22)':'rgba(0,0,0,0.05)';
    rr(ctx,s.x+4,s.y+4,s.w-8,s.h-8,10); ctx.fill();
    ctx.restore();
    if (id===null||id===undefined) continue;
    if (drag && drag.ti===i) continue;
    const p=PIECES[id];
    const fits=anyFit(st.board,p);
    const pw = runMode ? st.trayPower[i] : null;
    const pc = pw ? powerColor(pw) : null;
    // The power name owns a band at the bottom of the slot and the piece is centred in what is
    // left. Pinning the label to the slot floor while the piece centred in the FULL slot drew
    // the name INSIDE the block in landscape, where the slot is short and wide so the height
    // term binds: measured at 880x420, every piece 2+ cells tall covered it. Same rule as the
    // settings panel — pin the fixed row first, squeeze the content, never overlap.
    // The band is reserved in all three slots whether they carry a power or not, so a power
    // block is never a different size from its neighbours. Portrait is unchanged: there the
    // width term binds and cs comes out identical.
    const labelSize=Math.min(11,s.w*0.13), labelH=labelSize/2+14;
    const availH=s.h-labelH;
    const cs=Math.min((s.w-18)/Math.max(p.w,2.6),(availH-18)/Math.max(p.h,2.6), L.cell*0.95);
    const bobY = (T.style==='jelly'||T.style==='marshmallow'||T.style==='candy') ? Math.sin(now/480 + i*1.7)*3.2 : 0;
    const ox=s.x+(s.w-p.w*cs)/2, oy=s.y+(availH-p.h*cs)/2 + trayAnim*30 + bobY;
    ctx.save();
    ctx.globalAlpha=(fits?1:0.42)*(1-trayAnim*0.6);
    if(!fits) ctx.filter='grayscale(60%)';
    if (pw){ ctx.shadowColor=pc; ctx.shadowBlur=cs*0.60; }
    for(const [dx,dy] of p.cells)
      ctx.drawImage(blockSprite(cs,'wood',slotVariant(i)), ox+dx*cs, oy+dy*cs, cs, cs);
    ctx.restore();
    if (pw){
      // ALL cells of the piece are marked — the power belongs to the block, not the shape (spec §2)
      const pulse = 0.5+0.5*Math.sin(now/240);
      ctx.save();
      ctx.globalAlpha=(0.34+0.22*pulse)*(1-trayAnim*0.6);
      ctx.fillStyle=pc;
      for(const [dx,dy] of p.cells){ rr(ctx,ox+dx*cs+2,oy+dy*cs+2,cs-4,cs-4,cs*0.18); ctx.fill(); }
      ctx.globalAlpha=1-trayAnim*0.6;
      ctx.strokeStyle=pc; ctx.lineWidth=Math.max(2,cs*0.09);
      for(const [dx,dy] of p.cells){ rr(ctx,ox+dx*cs+2,oy+dy*cs+2,cs-4,cs-4,cs*0.18); ctx.stroke(); }
      // Magnet: an arrow hinting at the pull direction
      if (pw==='MAGNET'){
        ctx.globalAlpha=1-trayAnim*0.6;
        const [c0x,c0y]=p.cells[0];
        txt('⤡', ox+c0x*cs+cs/2, oy+c0y*cs+cs/2, cs*0.54, '#FFFFFF','center','800');
      }
      ctx.restore();
    }
    if (!fits){
      const pulse = 0.5+0.5*Math.sin(now/220);
      ctx.save();
      ctx.globalAlpha = (0.55+0.45*pulse)*(1-trayAnim*0.6);
      ctx.strokeStyle = C.err; ctx.lineWidth = Math.max(1.5, s.w*0.016);
      ctx.setLineDash([s.w*0.06, s.w*0.04]);
      rr(ctx, s.x+4, s.y+4, s.w-8, s.h-8, 10); ctx.stroke();
      ctx.restore();
      txt(S('noFit'), s.x+s.w/2, s.y+s.h-11, labelSize, C.err, 'center','800');
    } else if (pw){
      txt(powerName(pw), s.x+s.w/2, s.y+s.h-11, labelSize, pc,'center','800');
    }
  }
}

function drawDragPiece(){
  if(!drag || drag.howto) return;
  const p=PIECES[st.tray[drag.ti]];
  if (!p) return;
  const cs=L.cell;
  const posX = (drag.x !== undefined) ? drag.x : (drag.px - p.w*cs/2);
  const posY = (drag.y !== undefined) ? drag.y : (drag.py - p.h*cs - L.cell*lift());
  const rot = drag.rot || 0;
  const sx = drag.sx || 1.05;
  const sy = drag.sy || 1.05;

  const cx = posX + p.w*cs/2;
  const cy = posY + p.h*cs/2;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot * Math.PI / 180);
  ctx.scale(sx, sy);

  // Soft dynamic contact shadow underneath the jelly piece
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.ellipse(0, p.h*cs/2 + 12, p.w*cs*0.42, Math.max(4, cs*0.14), 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  const ox = -p.w*cs/2, oy = -p.h*cs/2;
  ctx.globalAlpha = 0.96;
  for(const [dx,dy] of p.cells){
    ctx.drawImage(blockSprite(cs,'wood',slotVariant(drag.ti)), ox+dx*cs, oy+dy*cs, cs, cs);
  }
  ctx.restore();
}

function txt(s,x,y,size,color,align='left',weight='600'){
  ctx.font=`${weight} ${size}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
  ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline='middle';
  ctx.fillText(s,x,y);
}

// Same as txt but shrinks until it fits maxW. lessons.md: measure text instead of assuming it
// fits — the title strip is squeezed between three buttons and the mode badge made it longer.
function txtFit(s,x,y,size,color,maxW,align='left',weight='600'){
  let sz = size;
  for (let i=0;i<12;i++){
    ctx.font=`${weight} ${sz}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
    if (ctx.measureText(s).width <= maxW || sz <= 8) break;
    sz -= 1;
  }
  txt(s,x,y,sz,color,align,weight);
}

let buttons=[];
function button(id,x,y,w,h,label,opts={}){
  buttons.push({id,x,y,w,h});
  const hot=opts.primary;
  ctx.save();
  ctx.fillStyle= opts.disabled ? (T.dark?'rgba(0,0,0,0.25)':'rgba(0,0,0,0.05)') : (hot?C.accent:T.btn);
  rr(ctx,x,y,w,h,h*0.28); ctx.fill();
  ctx.strokeStyle= T.dark?(hot?'rgba(255,255,255,0.35)':'rgba(255,255,255,0.14)'):'rgba(0,0,0,0.12)'; ctx.lineWidth=1.5;
  rr(ctx,x,y,w,h,h*0.28); ctx.stroke();
  ctx.restore();
  txt(label,x+w/2,y+h/2+1,Math.min(h*0.40,opts.textSize||19), opts.disabled?C.text2:(hot?(T.dark?'#12162E':'#3A2410'):C.text),'center','700');
}

function drawGoalStrip(x,y,w,h){
  const done=st.goalProgress, total=st.cfg.goalTotal;
  txt(S('goal'),x+2,y+h*0.28,11,C.text2,'left','700');
  if (st.cfg.goalType==='lines'){
    const bw=w-118, bh=Math.min(12,h*0.26), by=y+h*0.62;
    ctx.fillStyle= T.dark?'rgba(0,0,0,0.40)':'rgba(0,0,0,0.10)'; rr(ctx,x,by-bh/2,bw,bh,bh/2); ctx.fill();
    ctx.fillStyle=C.accent; const p=Math.min(1,done/total);
    if(p>0){ rr(ctx,x,by-bh/2,Math.max(bh,bw*p),bh,bh/2); ctx.fill(); }
    txt(S('goalLines', {done, total}),x+w,by,14,C.text,'right','700');
  } else {
    const n=total, r=Math.min(11,(w-90)/(n*2.6));
    for(let i=0;i<n;i++){
      const cx=x+r+i*(r*2.6), cy=y+h*0.64;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle= i<done ? C.accent : (T.dark?'rgba(0,0,0,0.40)':'rgba(0,0,0,0.07)'); ctx.fill();
      ctx.strokeStyle= i<done ? 'rgba(255,255,255,0.4)' : C.target; ctx.lineWidth=2; ctx.stroke();
    }
    txt(`${done}/${total}`,x+w,y+h*0.64,14,C.text,'right','700');
  }
}

function textW(s,size,weight='600'){
  ctx.font=`${weight} ${size}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
  return ctx.measureText(String(s)).width;
}

// The strip is laid out RIGHT to LEFT and everything is measured, because it is the busiest
// 50 pixels in the game: multiplier, streak, chain, a status line, LINES and BEST all want the
// same band. It used to draw them at fixed positions and they landed on top of each other.
// Priority order is right to left; whatever no longer fits is DROPPED, never overlapped.
function drawRunStrip(x,y,w,h){
  // combo multiplier — accrues through the run, never resets (spec §2)
  const mw=Math.min(74,w*0.24);
  ctx.save();
  ctx.fillStyle= st.comboMult>1 ? PAINT_C : (T.dark?'rgba(0,0,0,0.30)':'rgba(0,0,0,0.06)');
  rr(ctx,x+w-mw,y+h*0.24,mw,h*0.54,h*0.27); ctx.fill();
  ctx.restore();
  txt(`×${st.comboMult.toFixed(1)}`, x+w-mw/2, y+h*0.52, 14,
      st.comboMult>1?'#241C17':C.text2,'center','800');
  let bx = x+w-mw-10;
  // streak: how many blasts came back to back — this is what drives the urge to keep it going.
  // It reads st.streak alone, deliberately: since streakSurvivesBlastDeath the badge outlives the
  // Painter by one move, so anything gated on st.painter here would blank it exactly at the moment
  // the player earned it.
  if (st.streak>0){
    const sp=0.5+0.5*Math.sin(now/160);
    const label=S('streak', {n: st.streak});
    const sw=Math.min(96, Math.max(56, textW(label,12.5,'800')+22)); bx-=sw;
    ctx.save(); ctx.globalAlpha=0.85+0.15*sp;
    ctx.fillStyle=C.accent; rr(ctx,bx,y+h*0.24,sw,h*0.54,h*0.27); ctx.fill(); ctx.restore();
    txt(label, bx+sw/2, y+h*0.52, 12.5, '#241C17','center','800');
    bx-=8;
  }
  // COMBO CHAIN + its grace. The pips are the whole point: the player must SEE the chain
  // burning down, otherwise there is no reason to hunt for the next clear.
  // A chain of 1 is not a chain and pays no bonus — the badge used to read "CHAIN 1 ×1.00",
  // pure noise in the busiest corner. It appears from 2 up, where it means something.
  if (st.combo>=2){
    const lives = POWER_CFG.comboGrace + 1 - st.comboMiss;
    const label = S('comboChain', {n: st.combo, f: comboFactor(st.combo).toFixed(2)});
    const room = bx - (x + w*0.30);
    const cw = Math.max(46, Math.min(textW(label,12,'800')+20, w*0.34, room));
    const tight = cw < textW(label,12,'800')+12;
    bx -= cw;
    const hot = st.comboMiss>0;                       // already burning
    const sp = 0.5+0.5*Math.sin(now/(hot?110:260));
    ctx.save(); ctx.globalAlpha = hot ? 0.55+0.45*sp : 0.9;
    ctx.fillStyle = hot ? C.err : PAINT_C;
    rr(ctx,bx,y+h*0.20,cw,h*0.62,h*0.31); ctx.fill(); ctx.restore();
    txt(tight ? `×${comboFactor(st.combo).toFixed(2)}` : label,
        bx+cw/2, y+h*0.45, tight?11:12, '#241C17','center','800');
    const pips = POWER_CFG.comboGrace+1, r=2.6, gap=r*2.9;
    const px0 = bx+cw/2-(pips-1)*gap/2;
    for(let i=0;i<pips;i++){
      ctx.beginPath(); ctx.arc(px0+i*gap, y+h*0.68, r, 0, Math.PI*2);
      ctx.fillStyle = i<lives ? 'rgba(36,28,23,0.85)' : 'rgba(36,28,23,0.22)'; ctx.fill();
    }
  }
  // painted-cell counter / turns until the next power — both show in-run progression.
  // Lower priority than the badges: shown only if the room it needs is actually free.
  let status, statusCol;
  if (st.painter){
    // The cap is paintLimit PLUS whatever multi-line rewards have added; showing the base number
    // made the counter read "9/10" while the real ceiling was 13.
    const cap = POWER_CFG.paintLimit + st.paintBonus;
    status = S('paintLeft', {n: st.painter.painted.length, cap, left: st.painter.remaining});
    // At the cap, newly placed cells are NOT painted, so completing a line next to the Painter
    // does not blast. Measured on 34-42% of blasts, and until now the counter said nothing about
    // it — the number was visible and its consequence was not.
    statusCol = st.painter.painted.length >= cap ? C.err : PAINT_C;
  } else {
    const gap = specialGap(st);
    status = S('powerIn', {n: gap - (st.refills % gap), gap});
    statusCol = C.text2;
  }
  const stW = textW(status,11.5,'700');
  if (bx - (x+w*0.30) > stW + 14){
    txt(status, bx-6, y+h*0.52, 11.5, statusCol,'right','700');
    bx -= stW + 14;
  }

  // LINES always fits; BEST is dropped rather than run into whatever is on its right.
  txt(S('lines'), x+2, y+h*0.30, 11, C.text2,'left','700');
  txt(String(st.linesTotal), x+2, y+h*0.72, 20, C.text,'left','800');
  const bestX = x+w*0.30;
  const bestW = Math.max(textW(S('best'),11,'700'), textW(SAVE.best||0,20,'800'));
  if (bestX + bestW < bx - 6){
    txt(S('best'), bestX, y+h*0.30, 11, C.text2,'left','700');
    txt(String(SAVE.best||0), bestX, y+h*0.72, 20, C.text2,'left','800');
  }
}

// ─── game/ui.js ───────────────────────────────────────────────
// Play screen layout, HUD, overlays, menu and settings.

// The experimental mode has to be readable from inside the run, or a tester cannot tell which
// rules produced the board they are looking at. Appended to the title so it costs no layout.
function runTitle(){
  if (!runMode) return `${level.id}. ${level.name}`;
  return st.board.regionFree ? `POWER JAM · ${S('freeTag')}` : 'POWER JAM';
}

function drawPlay(){
  drawBackground();
  ctx.save();
  if (shake>0){ const a=shake*L.cell*0.10; ctx.translate((Math.random()-0.5)*a,(Math.random()-0.5)*a); }
  if (punch>0){
    // impact: the board swells for a moment then snaps back — gives the hit weight
    const p = punch*punch, cx=L.board.x+L.board.s/2, cy=L.board.y+L.board.s/2;
    const s = 1 + 0.055*p;
    ctx.translate(cx,cy); ctx.scale(s,s); ctx.translate(-cx,-cy);
  }

  const pad=L.pad;
  if (L.portrait){
    // top bar
    button('back',pad,pad*0.6,54,L.topH*0.72,'←');
    // A centred label is limited by the NEARER button, not by the total gap: twice the distance
    // from the centre to the closest edge. Getting this wrong put the title under the ↻ button.
    txtFit(runTitle(), W/2, pad*0.6+L.topH*0.36, 17, C.text,
           2*Math.min(W/2-(pad+54), (W-pad-54-58)-W/2) - 12, 'center','700');
    button('restart',W-pad-54-58,pad*0.6,54,L.topH*0.72,'↻');
    button('menu',W-pad-54,pad*0.6,54,L.topH*0.72,'≡');
    if (runMode) drawRunStrip(pad, L.topH, W-pad*2, L.goalH);
    else drawGoalStrip(pad, L.topH, W-pad*2, L.goalH);
  } else {
    button('back',pad,pad*0.4,50,L.topH*0.68,'←');
    txtFit(runTitle(), W/2, pad*0.4+L.topH*0.34, 16, C.text,
           2*Math.min(W/2-(pad+50), (W-pad-50-54)-W/2) - 12, 'center','700');
    button('restart',W-pad-50-54,pad*0.4,50,L.topH*0.68,'↻');
    button('menu',W-pad-50,pad*0.4,50,L.topH*0.68,'≡');
    if (runMode) drawRunStrip(L.left.x, L.left.y+10, L.left.w, 54);
    else drawGoalStrip(L.left.x, L.left.y+10, L.left.w, 54);
    txt(S('score'),L.left.x,L.left.y+96,11,C.text2,'left','700');
    txt(String(st.score),L.left.x,L.left.y+122,26,C.accent,'left','800');
    txt(st.cfg.moveLimit ? S('movesLimit',{n:st.moves, limit:st.cfg.moveLimit})
                         : S('movesN',{n:st.moves}), L.left.x,L.left.y+152,13,C.text2,'left');
    if(!runMode) button('undo',L.left.x,L.left.y+178,L.left.w*0.8,42,`↶  ${st.undoLeft}`,{disabled:st.undoLeft<=0||st.undoStack.length===0});
  }

  drawBoardFrame();
  drawCells();
  drawFlash();
  drawTray();
  drawDragPiece();

  if (L.portrait){
    const h=L.hud;
    if(!runMode) button('undo',pad,h.y+h.h*0.12,86,h.h*0.72,`↶ ${st.undoLeft}`,{disabled:st.undoLeft<=0||st.undoStack.length===0});
    txt(String(st.score), W-pad, h.y+h.h*0.46, 24, C.accent,'right','800');
    txt(S('score'), W-pad, h.y+h.h*0.80, 10, C.text2,'right','700');
    if (st.cfg.moveLimit) txt(S('movesLimit', {n: st.moves, limit: st.cfg.moveLimit}), W/2, h.y+h.h*0.5, 13, C.text2,'center');
    else txt(S('movesN', {n: st.moves}), W/2, h.y+h.h*0.5, 13, C.text2,'center');
  }

  // onboarding banner — sits just above the board and fades on its own
  if (hint){
    const H0=HINTS[hint.key], col=H0.c();
    const k=hint.t/hint.dur;
    const a = k<0.08 ? k/0.08 : (k>0.86 ? (1-k)/0.14 : 1);
    // It used to sit ABOVE the board (L.board.y-bh-10), straight through the LINES / BEST /
    // CHAIN strip — two texts in the same pixels, neither readable. It now sits just inside
    // the top of the board: the panel is opaque, and when a hint fires the board is still
    // mostly empty, so it covers nothing that matters.
    const bw=Math.min(W-L.pad*2, 460), bh=52;
    const bx=(W-bw)/2, by=L.board.y+8;
    hintRect={x:bx,y:by,w:bw,h:bh};
    ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(1,a));
    ctx.fillStyle= T.dark?'rgba(6,8,20,0.94)':'rgba(255,255,255,0.96)';
    rr(ctx,bx,by,bw,bh,12); ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=2; rr(ctx,bx,by,bw,bh,12); ctx.stroke();
    ctx.fillStyle=col; rr(ctx,bx,by,4,bh,2); ctx.fill();
    txt(S(H0.t), bx+16, by+19, 13, col,'left','800');
    txt(S(H0.s), bx+16, by+37, 11.5, C.text2,'left');
    ctx.restore();
  }

  // Banner column. Callers used to pick their own y and several banners landed in the same
  // pixels — a clear, a synergy pull and an expiry could all fire on one move and none of the
  // three could be read. The caller's y is ignored now: they queue into one column low on the
  // board, one row each, newest at the bottom, three at most (enforced in addFx).
  const bannerY = L.board.y + L.board.s*0.62;
  for(const f of fx){ if(f.kind!=='combo') continue;
    const k=f.t/f.dur, sc=k<0.25?(k/0.25)*1.2:1.2-(k-0.25)/0.75*0.2;
    const fit=Math.min(1, L.board.s*0.94/Math.max(1,textW(f.text,22,'800')*sc));
    ctx.save(); ctx.globalAlpha=1-Math.max(0,(k-0.55)/0.45);
    ctx.translate(boardCX(), bannerY+(f.slot||0)*32-k*40); ctx.scale(sc*fit,sc*fit);
    txt(f.text,0,0,22,C.accent,'center','800');
    ctx.restore();
  }

  // expanding ring that draws attention to the newly spawned Painter
  for(const f of fx){ if(f.kind!=='spawn') continue;
    const k=f.t/f.dur;
    ctx.save(); ctx.globalAlpha=(1-k)*0.9;
    ctx.strokeStyle=PAINT_C; ctx.shadowColor=PAINT_C; ctx.shadowBlur=20;
    ctx.lineWidth=Math.max(2,L.cell*0.14*(1-k));
    ctx.beginPath(); ctx.arc(f.x,f.y,L.cell*(0.3+2.4*k),0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha=(1-k)*0.5;
    ctx.beginPath(); ctx.arc(f.x,f.y,L.cell*(0.2+1.5*k),0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // blast score — Balatro's "here is what you just did" moment
  for(const f of fx){ if(f.kind!=='bignum') continue;
    const k=f.t/f.dur;
    const sc = k<0.18 ? 0.4+1.0*(1-Math.pow(1-k/0.18,3))     // shoots in
             : k<0.62 ? 1.4-0.15*((k-0.18)/0.44)             // settles gently
             : 1.25;
    // 34px at scale 1.4 is wider than a phone: "PAINTER EMPOWERED" ran off both edges and was
    // cut in half. Shrink whatever it takes to fit the board.
    const fit = Math.min(1, L.board.s*0.90/Math.max(1,textW(f.text,34,'800')*sc));
    ctx.save();
    ctx.globalAlpha = k<0.7 ? 1 : 1-(k-0.7)/0.3;
    ctx.translate(f.x, f.y - Math.max(0,(k-0.5))*70);
    ctx.scale(sc*fit,sc*fit);
    ctx.shadowColor=PAINT_C; ctx.shadowBlur=26;
    txt(f.text, 0, 0, 34, '#FFFFFF','center','800');
    ctx.shadowBlur=0;
    txt(f.sub, 0, 26, 13, PAINT_C,'center','700');
    if (f.streak>1){
      // streak: "you blasted again" — the one readout that feeds the urge to keep going
      ctx.shadowColor=C.accent; ctx.shadowBlur=18;
      txt(S('streak', {n: f.streak}), 0, -34, 20, C.accent,'center','800');
    }
    ctx.restore();
  }
  ctx.restore();

  if (overlay) drawOverlay();
}

function drawOverlay(){
  const k=Math.min(1,(now-overlayAt)/260);
  ctx.save(); ctx.globalAlpha=k*0.78; ctx.fillStyle= T.dark?'#05060F':'#3A3020'; ctx.fillRect(0,0,W,H); ctx.restore();
  ctx.save(); ctx.globalAlpha=k;
  const bw=Math.min(W*0.86,380), bh=overlay==="WON"?240:(runMode?306:190);
  const bx=(W-bw)/2, by=(H-bh)/2;
  ctx.fillStyle=T.panel; rr(ctx,bx,by,bw,bh,18); ctx.fill();
  ctx.strokeStyle=T.dark?'rgba(255,255,255,0.14)':'rgba(0,0,0,0.10)'; ctx.lineWidth=2; rr(ctx,bx,by,bw,bh,18); ctx.stroke();

  if (overlay==='WON'){
    for(let i=0;i<3;i++){
      const on=i<lastStars, kk=Math.min(1,Math.max(0,(now-overlayAt-260-i*150)/300));
      const cx=bx+bw/2+(i-1)*52, cy=by+56, s=(on?1:0.8)*(0.5+0.5*kk)*22;
      ctx.save(); ctx.translate(cx,cy); ctx.globalAlpha=k*(on?kk:0.35);
      ctx.beginPath();
      for(let j=0;j<10;j++){ const a=-Math.PI/2+j*Math.PI/5, r=j%2?s*0.45:s;
        j?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r); }
      ctx.closePath(); ctx.fillStyle=on?C.accent:(T.dark?'rgba(255,255,255,0.16)':'rgba(0,0,0,0.14)'); ctx.fill(); ctx.restore();
    }
    txt(S('levelComplete'),bx+bw/2,by+108,20,C.text,'center','700');
    txt(S('levelResult', {moves: st.moves, score: st.score, par: level.par}),bx+bw/2,by+136,13,C.text2,'center');
    button('lvsel',bx+20,by+bh-62,(bw-56)/2,44,S('levels'));
    button('next',bx+bw/2+8,by+bh-62,(bw-56)/2,44,S('next'),{primary:true});
  } else {
    const msg = st.lossReason==='MOVE_LIMIT' ? S('outOfMoves') : S('noRoomLeft');
    txt(msg,bx+bw/2,by+56,21,C.text,'center','700');
    if (runMode){
      const isBest = st.score >= (SAVE.best||0);
      txt(S('pts', {n: st.score}),bx+bw/2,by+88,26,C.accent,'center','800');
      txt(isBest ? S('newBest') : S('bestScore', {n: SAVE.best||0}), bx+bw/2,by+108,11.5,
          isBest?C.accent:C.text2,'center','700');

      // --- run summary: "what happened this run" readable at a glance
      const rows = [
        [S('sumBlasts'), String(st.blasts), st.blasts>0?PAINT_C:C.text2],
        [S('sumStreak'), `×${st.bestStreak||0}`, (st.bestStreak||0)>1?C.accent:C.text2],
        [S('sumPainted'), String(st.paintedBlasted||0), C.text],
        [S('sumMult'), `×${(st.bestMult||1).toFixed(1)}`, (st.bestMult||1)>1?PAINT_C:C.text2],
        [S('sumLines'), String(st.linesTotal), C.text],
        [S('sumMoves'), String(st.moves), C.text],
      ];
      const rx=bx+26, rw=bw-52, ry=by+126;
      ctx.save(); ctx.globalAlpha=k*(T.dark?0.30:0.06);
      ctx.fillStyle= T.dark?'#000':'#000'; rr(ctx,rx-10,ry-12,rw+20,rows.length*19+16,10); ctx.fill();
      ctx.restore();
      rows.forEach(([lbl,val,col],i)=>{
        const yy=ry+i*19;
        txt(lbl, rx, yy, 12, C.text2,'left');
        txt(val, rx+rw, yy, 12.5, col,'right','800');
      });
    } else txt(S('retryFree'),bx+bw/2,by+92,13,C.text2,'center');
    button('lvsel',bx+20,by+bh-62,(bw-56)/2,44,S('levels'));
    button('retry',bx+bw/2+8,by+bh-62,(bw-56)/2,44,S('retry'),{primary:true});
  }
  ctx.restore();
}

function star(px,py,r,fill){
  ctx.beginPath();
  for(let j=0;j<10;j++){ const a=-Math.PI/2+j*Math.PI/5, rad=j%2?r*0.45:r;
    j?ctx.lineTo(px+Math.cos(a)*rad,py+Math.sin(a)*rad):ctx.moveTo(px+Math.cos(a)*rad,py+Math.sin(a)*rad); }
  ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
}
function padlock(cx,cy,s){
  ctx.save(); ctx.strokeStyle=C.text2; ctx.lineWidth=Math.max(2,s*0.13);
  ctx.beginPath(); ctx.arc(cx,cy-s*0.32,s*0.34,Math.PI,0); ctx.stroke();
  ctx.fillStyle=C.text2;
  ctx.globalAlpha=0.7; rr(ctx,cx-s*0.5,cy-s*0.1,s,s*0.78,s*0.16); ctx.fill(); ctx.globalAlpha=1;
  ctx.restore();
}

// Rows FLOW from a cursor — they used to sit at hardcoded offsets (by+366, by+380) while the
// footer was pinned to by+bh-104, so on any screen shorter than ~600px the language row was
// drawn straight through the sound button. Now the footer is pinned, the rows above take what
// is left, and `k` squeezes them. The finger preview is decorative, so it is the first thing
// dropped; the lift description is the second.
// The dials the lab panel exposes. Every one of these is a mechanic that was built, measured and
// left switched off (or on) this session — the point of the panel is to feel what the numbers say.
// `off`/`on` make a numeric dial behave like a toggle so the whole panel is one kind of control.
const LAB_DIALS = [
  { key:'sweepBroken' },
  { key:'sweepOnlyIsolated' },
  { key:'survivesAtLastMove' },
  { key:'streakSurvivesBlastDeath' },
  { key:'anchorMinStreak', off:0, on:2 },
];
const labIsOn = d => d.on === undefined ? !!POWER_CFG[d.key] : POWER_CFG[d.key] === d.on;
function labToggle(d){
  if (d.on === undefined) POWER_CFG[d.key] = !POWER_CFG[d.key];
  else POWER_CFG[d.key] = labIsOn(d) ? d.off : d.on;
}

function drawSettings(){
  ctx.save(); ctx.globalAlpha=0.84; ctx.fillStyle= T.dark?'#05060F':'#3A3020'; ctx.fillRect(0,0,W,H); ctx.restore();
  const bw=Math.min(W*0.92,420), bh=Math.min(H*0.94,600);
  const bx=(W-bw)/2, by=(H-bh)/2;
  ctx.fillStyle=T.panel; rr(ctx,bx,by,bw,bh,18); ctx.fill();
  ctx.strokeStyle=T.dark?'rgba(255,255,255,0.14)':'rgba(0,0,0,0.10)'; ctx.lineWidth=2;
  rr(ctx,bx,by,bw,bh,18); ctx.stroke();

  const ix=bx+22, iw=bw-44;
  const titleH=Math.min(44,bh*0.09);
  txt(S('settings'), bx+bw/2, by+titleH*0.68, Math.min(21,bw*0.055), C.text,'center','700');

  // footer first: sound + close must ALWAYS be reachable, whatever happens above
  const btnH=Math.max(38,Math.min(46,bh*0.078));
  const footTop=by+bh-16-btnH*2-8;
  const top=by+titleH;
  const room=footTop-top-10;

  const LBL=16, SWATCH=70, BTN=46, DESC=24, FINGER=62, GAP=14;
  // The lab block only exists inside the experimental mode, and it is the FIRST thing dropped when
  // the panel is short — a dev affordance must never push `close` off the screen.
  const inLab = runMode && st && st.board && st.board.regionFree;
  const LAB = inLab ? GAP + LBL + Math.ceil(LAB_DIALS.length/2)*(BTN*0.62+6) : 0;
  const rowsFull = LBL+SWATCH+GAP + LBL+BTN+DESC+GAP + FINGER+GAP + LBL+BTN + LAB;

  // the decorative rows — the finger preview and the lift description — go before it. Outside the

  if (showLab){

    if (room < need*0.92){ showLab=false;   need-=LAB; }

  y+=gap;

  if (showFinger){

    ctx.drawImage(blockSprite(cs,'wood',0), fx0-cs/2, fy0-cs-cs*lift(), cs, cs);
    ctx.drawImage(blockSprite(cs,'wood',1), fx0-cs/2-cs, fy0-cs-cs*lift(), cs, cs);
    ctx.strokeStyle=C.text2; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(fx0,fy0,13,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle= T.dark?'rgba(255,255,255,0.14)':'rgba(0,0,0,0.08)';
    ctx.beginPath(); ctx.arc(fx0,fy0,13,0,Math.PI*2); ctx.fill();
    txt(S('finger'), fx0+24, fy0, 11, C.text2,'left');
    y+=FINGER*k+gap;
  }

  // --- LANGUAGE
  txt(S('language'), ix, y+lblH*0.5, 11, C.text2,'left','700'); y+=lblH;

  // Dropped first when the panel is short: it is a testing affordance, not part of the product.
  if (showLab){

  button('popfx', ix + halfW + 8, footTop, halfW, btnH, SAVE.settings.popPhysics !== false ? S('popfxOn') : S('popfxOff'));
