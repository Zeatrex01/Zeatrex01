<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#08080a">
    <meta name="description" content="Enes Aksu — Technical Animator &amp; 3D Generalist. Asset packs, games and contact, laid out as a small phone.">
    <meta name="author" content="Enes Aksu">
    <meta name="robots" content="index, follow">
    <meta name="copyright" content="Copyright (c) 2026 Enes Aksu. All rights reserved.">

    <meta property="og:title" content="Malik3D — Enes Aksu">
    <meta property="og:description" content="Technical Animator &amp; 3D Generalist. Asset packs, games and contact.">
    <meta property="og:type" content="website">

    <title>Malik3D — Enes Aksu</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff3a5e'/%3E%3Cpath d='M10 9h12L14 16h8l-12 8 4-8h-6z' fill='%23fff'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <a class="skip-link" href="#home" data-i18n="a11y.skip">Skip to the home screen</a>

    <!-- The whole site is one phone. On a real phone it fills the viewport;
         on a wide screen it sits in the middle of the backdrop. -->
    <div class="stage">
        <div class="device">
            <div class="device__screen">

                <!-- ============ BOOT ============ -->
                <div class="boot" id="boot">
                    <span class="boot__mark" aria-hidden="true">
                        <svg viewBox="0 0 32 32"><path d="M10 9h12L14 16h8l-12 8 4-8h-6z" /></svg>
                    </span>
                    <span class="boot__label" data-i18n="os.boot">Starting up</span>
                    <span class="boot__bar" aria-hidden="true"><i></i></span>
                </div>

                <!-- ============ STATUS BAR ============ -->
                <header class="status">
                    <time class="status__time" id="clock"></time>
                    <span class="status__carrier" data-i18n="os.carrier">MALIK3D</span>
                    <span class="status__right">
                        <button class="status__lang" id="langToggle" type="button" aria-label="Change language">
                            <span data-i18n="os.langLabel">TR</span>
                        </button>
                        <svg class="status__glyph" viewBox="0 0 18 12" aria-hidden="true">
                            <rect x="0" y="8" width="3" height="4" rx="1" />
                            <rect x="5" y="5" width="3" height="7" rx="1" />
                            <rect x="10" y="2" width="3" height="10" rx="1" />
                            <rect x="15" y="0" width="3" height="12" rx="1" opacity=".35" />
                        </svg>
                        <svg class="status__glyph" viewBox="0 0 26 12" aria-hidden="true">
                            <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".45" />
                            <rect x="2.5" y="2.5" width="14" height="7" rx="2" />
                            <path d="M23.5 4v4a2.6 2.6 0 0 0 0-4z" opacity=".45" />
                        </svg>
                    </span>
                </header>

                <!-- ============ SCREENS ============ -->
                <main class="viewport" id="viewport">
                    <section class="home" id="home">
                        <div class="widget" id="widget"></div>
                        <ul class="apps" id="apps"></ul>
                        <p class="home__hint" data-i18n="os.hint"></p>
                        <ul class="dock" id="dock"></ul>
                    </section>
                    <!-- app screens are injected here by app.js -->
                </main>

                <!-- ============ HOME INDICATOR ============ -->
                <button class="homebar" id="homebar" type="button">
                    <span class="homebar__grip" aria-hidden="true"></span>
                </button>

            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
