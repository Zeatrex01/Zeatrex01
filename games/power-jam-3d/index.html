// a physical surface and the finger touches it, rather than a grid of rectangles on a screen.
function pickPlane(invVP, ndcX, ndcY, planeY){
  const un = (z) => {
    const x = invVP[0]*ndcX + invVP[4]*ndcY + invVP[8]*z + invVP[12];
    const y = invVP[1]*ndcX + invVP[5]*ndcY + invVP[9]*z + invVP[13];
    const w = invVP[2]*ndcX + invVP[6]*ndcY + invVP[10]*z + invVP[14];
    const q = invVP[3]*ndcX + invVP[7]*ndcY + invVP[11]*z + invVP[15];
    return [x/q, y/q, w/q];
  };
  const a = un(-1), b = un(1);
  const dy = b[1] - a[1];
  if (Math.abs(dy) < 1e-6) return null;
  const t = (planeY - a[1]) / dy;
  return [a[0] + (b[0]-a[0])*t, planeY, a[2] + (b[2]-a[2])*t];
}

// Synthetic sound, same approach as the 2D game: oscillators, no audio files, so the concept
// stays one file. The blast is pitched by the streak — the ear is told "again, and bigger".
let AC3 = null, muted3 = false;
function ac3(){ if(!AC3){ try{ AC3 = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC3; }
function tone3(freq, dur, type, vol, slide){
  const a = ac3(); if (!a || muted3) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, a.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, a.currentTime + dur);
  g.gain.setValueAtTime(0.0001, a.currentTime);
  g.gain.exponentialRampToValueAtTime(vol || 0.12, a.currentTime + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur + 0.02);
}
function sfx3(kind, n){
  if (kind === 'pick')  tone3(300 + Math.random()*30, 0.07, 'sine', 0.07, 460);
  else if (kind === 'place') tone3(190 + Math.random()*40, 0.10, 'triangle', 0.11, 105);
  else if (kind === 'clear'){ const semi = Math.min(n||1, 8) - 1, base = 520 * Math.pow(2, semi/12);
    tone3(base, 0.16, 'sine', 0.14); setTimeout(()=>tone3(base*1.5, 0.14, 'sine', 0.09), 55); }
  else if (kind === 'paint'){ tone3(440, 0.22, 'sine', 0.10, 900); setTimeout(()=>tone3(680, 0.16, 'triangle', 0.07), 90); }
  else if (kind === 'magnet'){ tone3(920, 0.20, 'sine', 0.09, 300); setTimeout(()=>tone3(300, 0.14, 'triangle', 0.07), 110); }
  else if (kind === 'charge'){ tone3(210, 0.28, 'sawtooth', 0.05, 780);
    [0,90,180].forEach((d,i)=>setTimeout(()=>tone3(520*Math.pow(2,i/12), 0.10, 'sine', 0.05), d)); }
  else if (kind === 'blast'){ const s = Math.min(n||1, 8), up = Math.pow(2, (s-1)*2/12);
    tone3(150*up, 0.42, 'square', 0.16, 50*up);
    tone3(88*up, 0.36, 'sawtooth', 0.12, 40*up);
    [740,980,1240,1560].forEach((f,i)=>setTimeout(()=>tone3(f*up, 0.20, 'sine', 0.12), 50+i*65)); }
  else if (kind === 'reward'){ [392,523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone3(f, 0.22, 'triangle', 0.12), i*70)); }
  else if (kind === 'record'){ [523,659,784,1046,1319].forEach((f,i)=>setTimeout(()=>tone3(f, 0.24, 'sine', 0.13), i*90)); }
  else if (kind === 'fizzle') tone3(420, 0.30, 'triangle', 0.07, 120);
  else if (kind === 'over')   tone3(260, 0.55, 'triangle', 0.10, 70);
}

// ─── game3d/fx3d.js ───────────────────────────────────────────
// Effects. The 2D game's juice rule holds here and gets easier to honour in 3D: a blast is
// ANTICIPATION → HIT-STOP → RELEASE. What changes is that the release is physical — the cubes
// that were on the board a frame ago are the cubes flying through the air, same colour, same
// size, thrown from where they stood. Nothing dissolves into a particle sprite.

let debris = [];        // launched cubes, real gravity, real spin
let waves = [];         // shockwave rings on the slab
let pops = [];          // world-anchored score numbers, drawn by the HUD
let banners = [];       // screen-anchored headlines
let freeze3 = 0;        // hit-stop, ms — nothing advances while this runs
let flashAmt = 0;       // full-screen bloom on the background

const GRAV = 26;

function launch(x, y, z, col, opts = {}){
  const spread = opts.spread ?? 1;
  const up = opts.up ?? 8;
  debris.push({
    x, y, z,
    vx: (Math.random()-0.5) * spread * 7 + (opts.dx||0),
    vy: up * (0.65 + Math.random()*0.7),
    vz: (Math.random()-0.5) * spread * 7 + (opts.dz||0),
    rx: 0, ry: 0, rz: 0,
    vrx: (Math.random()-0.5)*12, vry: (Math.random()-0.5)*12, vrz: (Math.random()-0.5)*12,
    s: opts.s ?? BLOCK_XZ, col, glow: opts.glow ?? 0,
    t: 0, dur: opts.dur ?? 1100,
  });
}

function shockwave(x, z, col, r = 7, dur = 620){
  waves.push({ x, z, col, r, t: 0, dur });
}

function popNumber(x, y, z, text, sub, col){
  pops.push({ x, y, z, text, sub, col, t: 0, dur: 1000 });
}

// One column, one row each, newest at the bottom — the same rule the 2D game arrived at after
// three banners landed in the same pixels. The row is the first FREE one, never the count.
const BANNER_MAX = 3;
function banner(text, col, dur = 800){
  while (banners.length >= BANNER_MAX) banners.shift();
  const taken = new Set(banners.map(b => b.slot));
  let slot = 0; while (taken.has(slot)) slot++;
  banners.push({ text, col, t: 0, dur, slot });
}

function updateFx3(dt){
  if (freeze3 > 0){ freeze3 -= dt; return; }
  const s = dt / 1000;
  for (let i = debris.length - 1; i >= 0; i--){
    const d = debris[i];
    d.t += dt;
    d.vy -= GRAV * s;
    d.x += d.vx * s; d.y += d.vy * s; d.z += d.vz * s;
    d.rx += d.vrx * s; d.ry += d.vry * s; d.rz += d.vrz * s;
    if (d.y < d.s * 0.6 && d.vy < 0){       // one bounce off the slab, then it is spent
      d.y = d.s * 0.6; d.vy = -d.vy * 0.34;
      d.vx *= 0.7; d.vz *= 0.7;
    }
    if (d.t >= d.dur) debris.splice(i, 1);
  }
  for (let i = waves.length - 1; i >= 0; i--){ waves[i].t += dt; if (waves[i].t >= waves[i].dur) waves.splice(i,1); }
  for (let i = pops.length - 1; i >= 0; i--){ pops[i].t += dt; if (pops[i].t >= pops[i].dur) pops.splice(i,1); }
  for (let i = banners.length - 1; i >= 0; i--){ banners[i].t += dt; if (banners[i].t >= banners[i].dur) banners.splice(i,1); }
  if (flashAmt > 0) flashAmt = Math.max(0, flashAmt - dt / 420);
  if (cam.shake > 0) cam.shake = Math.max(0, cam.shake - dt * 0.0055);
  if (cam.kick > 0)  cam.kick  = Math.max(0, cam.kick - dt / 300);
}

function clearFx3(){ debris = []; waves = []; pops = []; banners = []; freeze3 = 0; flashAmt = 0; cam.shake = 0; cam.kick = 0; }

// ─── game3d/hud3d.js ──────────────────────────────────────────
// The HUD is a 2D canvas laid over the WebGL one. Text belongs on a 2D context: drawing it in
// the 3D scene would mean a font atlas, and a billboarded score that scales with distance is
// harder to read, not more impressive. So the world is 3D and the readout is flat — the split
// every shipped 3D casual game uses.

let hctx = null, hcanvas = null, HW = 0, HH = 0, DPR = 1;
let hudButtons = [];

function hudInit(canvas){
  hcanvas = canvas;
  hctx = canvas.getContext('2d');
}
function hudResize(w, h, dpr){
  HW = w; HH = h; DPR = dpr;
  hcanvas.width = Math.round(w * dpr); hcanvas.height = Math.round(h * dpr);
  hcanvas.style.width = w + 'px'; hcanvas.style.height = h + 'px';
  hctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

const HC = {
  text:'#F6F1FF', dim:'#B4AEDA', accent:'#FFD98A',
  paint:'#FF7FB6', magnet:'#7BD8FF', err:'#FF8FA8',
  panel:'rgba(30,26,58,0.93)', line:'rgba(255,255,255,0.14)',
};

function ht(s, x, y, size, color, align = 'left', weight = '700'){
  hctx.font = `${weight} ${size}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
  hctx.fillStyle = color; hctx.textAlign = align; hctx.textBaseline = 'middle';
  hctx.fillText(s, x, y);
}
function htw(s, size, weight = '700'){
  hctx.font = `${weight} ${size}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
  return hctx.measureText(String(s)).width;
}
// Shrink until it fits. Same lesson as the 2D game: measure, never assume — a banner that runs
// off its own panel is the bug that only a screenshot ever finds.
function htFit(s, x, y, size, color, maxW, align = 'left', weight = '700'){
  let sz = size;
  for (let i = 0; i < 14; i++){
    if (htw(s, sz, weight) <= maxW || sz <= 8) break;
    sz -= 1;
  }
  ht(s, x, y, sz, color, align, weight);
}
function hrr(x, y, w, h, r){
  hctx.beginPath();
  hctx.moveTo(x+r, y); hctx.arcTo(x+w, y, x+w, y+h, r); hctx.arcTo(x+w, y+h, x, y+h, r);
  hctx.arcTo(x, y+h, x, y, r); hctx.arcTo(x, y, x+w, y, r); hctx.closePath();
}
function hbutton(id, x, y, w, h, label, primary){
  hudButtons.push({ id, x, y, w, h });
  hctx.save();
  hctx.fillStyle = primary ? HC.accent : 'rgba(255,255,255,0.08)';
  hrr(x, y, w, h, h*0.28); hctx.fill();
  hctx.strokeStyle = primary ? 'rgba(255,255,255,0.4)' : HC.line; hctx.lineWidth = 1.5;
  hrr(x, y, w, h, h*0.28); hctx.stroke();
  hctx.restore();
  ht(label, x + w/2, y + h/2 + 1, Math.min(h*0.42, 19), primary ? '#20160A' : HC.text, 'center', '800');
}

// world → screen, for the score numbers that belong to a place on the board
function project(vp, x, y, z){
  const cx = vp[0]*x + vp[4]*y + vp[8]*z + vp[12];
  const cy = vp[1]*x + vp[5]*y + vp[9]*z + vp[13];
  const cw = vp[3]*x + vp[7]*y + vp[11]*z + vp[15];
  if (cw <= 0.0001) return null;
  return [(cx/cw * 0.5 + 0.5) * HW, (1 - (cy/cw * 0.5 + 0.5)) * HH];
}

function drawHud3(vp){
  hctx.clearRect(0, 0, HW, HH);
  hudButtons = [];
  const pad = Math.round(Math.min(HW, HH) * 0.045);
  const narrow = HW < 420;

  // --- top left: lines, and the run's live status line
  ht(S3('lines'), pad, pad + 6, 11, HC.dim, 'left', '700');
  ht(String(st3.linesTotal), pad, pad + 28, 22, HC.text, 'left', '800');

  // --- top right: the multiplier, the streak, the chain. Right to left, dropped rather than
  //     overlapped, exactly as the 2D HUD learned to do it.
  let bx = HW - pad;
  const chip = (label, fill, fg) => {
    const w = Math.max(46, htw(label, 12.5, '800') + 20);
    bx -= w;
    hctx.save(); hctx.fillStyle = fill; hrr(bx, pad + 2, w, 26, 13); hctx.fill(); hctx.restore();
    ht(label, bx + w/2, pad + 15, 12.5, fg, 'center', '800');
    bx -= 8;
  };
  chip(S3('mult', {n: st3.comboMult.toFixed(1)}), st3.comboMult > 1 ? HC.paint : 'rgba(255,255,255,0.10)',
       st3.comboMult > 1 ? '#20160A' : HC.dim);
  if (st3.streak > 0) chip(S3('streak', {n: st3.streak}), HC.accent, '#20160A');
  if (st3.combo >= 2 && !narrow) chip(S3('chain', {n: st3.combo}), 'rgba(255,95,162,0.30)', HC.text);

  // --- the power status: how much paint is live, or how far the next power is
  let status, scol;
  if (st3.painter){
    const cap = POWER_CFG.paintLimit + st3.paintBonus;
    status = S3('paint', {n: st3.painter.painted.length, cap, left: st3.painter.remaining});
    scol = st3.painter.painted.length >= cap ? HC.err : HC.paint;
  } else {
    const gap = specialGap(st3);
    status = S3('powerIn', {n: gap - (st3.refills % gap)});
    scol = HC.dim;
  }
  if (bx - pad > htw(status, 11.5, '700') + 10) ht(status, bx - 2, pad + 15, 11.5, scol, 'right', '700');

  // --- bottom: the target bar. Carried over from the 2D game, where it is the only thing that
  //     tells a run how it is doing while it is still running.
  const by = HH - pad - 30;
  drawTarget3(pad, by, HW - pad*2);
  ht(S3('moves', {n: st3.moves}), HW/2, HH - pad + 4, 13, HC.dim, 'center', '600');
  ht(String(st3.score), HW - pad, HH - pad - 2, 26, HC.accent, 'right', '800');
  ht(S3('score'), HW - pad, HH - pad + 18, 10, HC.dim, 'right', '700');

  drawPops3(vp);
  drawBanners3();
  drawHint3();
}

function drawTarget3(x, y, w){
  const t = runTarget3();
  if (!t) return;
  let prev = 0;
  for (const v of targetMarks3()) if (v <= st3.score) prev = v;
  const k = Math.max(0, Math.min(1, (st3.score - prev) / (t.value - prev)));
  const col = t.best ? HC.accent : HC.paint;
  hctx.save();
  hctx.fillStyle = 'rgba(255,255,255,0.10)'; hrr(x, y, w, 5, 2.5); hctx.fill();
  hctx.fillStyle = col; hctx.globalAlpha = 0.6 + 0.4 * (0.5 + 0.5*Math.sin(now3/420));
  hrr(x, y, Math.max(5, w*k), 5, 2.5); hctx.fill();
  hctx.restore();
  const gap = S3('targetLeft', {n: Math.max(0, t.value - st3.score)});
  const name = t.best ? S3('targetBest', {n: t.value}) : S3('targetNext', {n: t.value});
  const full = `${name} · ${gap}`;
  const room = HW/2 - htw(S3('moves', {n: st3.moves}), 13, '600')/2 - x - 12;
  ht(htw(full, 10.5, '700') <= room ? full : gap, x, y + 16, 10.5, col, 'left', '700');
}

function drawPops3(vp){
  for (const p of pops){
    const k = p.t / p.dur;
    const sp = project(vp, p.x, p.y + k * 2.2, p.z);
    if (!sp) continue;
    hctx.save();
    hctx.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
    const sc = k < 0.16 ? 0.5 + 0.9 * (k / 0.16) : 1.4 - 0.15 * Math.min(1, (k - 0.16) / 0.5);
    hctx.translate(sp[0], sp[1]); hctx.scale(sc, sc);
    hctx.shadowColor = 'rgba(0,0,0,0.85)'; hctx.shadowBlur = 12;
    hctx.font = '800 30px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
    hctx.textAlign = 'center'; hctx.textBaseline = 'middle';
    hctx.lineWidth = 6; hctx.strokeStyle = 'rgba(4,8,14,0.9)';
    hctx.strokeText(p.text, 0, 0);
    hctx.shadowColor = p.col; hctx.shadowBlur = 20;
    ht(p.text, 0, 0, 30, '#FFFFFF', 'center', '800');
    hctx.shadowBlur = 0;
    if (p.sub) ht(p.sub, 0, 22, 13, p.col, 'center', '800');
    hctx.restore();
  }
}

function drawBanners3(){
  const baseY = HH * 0.245;   // below the onboarding line, above the world-anchored score pops
  for (const b of banners){
    const k = b.t / b.dur;
    const sc = k < 0.25 ? (k/0.25) * 1.15 : 1.15 - (k-0.25)/0.75 * 0.15;
    hctx.save();
    hctx.globalAlpha = 1 - Math.max(0, (k - 0.6) / 0.4);
    hctx.translate(HW/2, baseY + b.slot * 34 - k * 26);
    hctx.scale(sc, sc);
    hctx.shadowColor = b.col; hctx.shadowBlur = 18;
    htFit(b.text, 0, 0, 24, b.col, HW * 0.86, 'center', '800');
    hctx.restore();
  }
}

// The onboarding line. Three showings each, then it never appears again — the concept has to
// explain itself without a tutorial screen.
let hint3 = null;
function showHint3(key){
  if (hintsSeen3[key] >= 3 || (hint3 && hint3.key === key)) return;
  hintsSeen3[key] = (hintsSeen3[key] || 0) + 1;
  hint3 = { key, t: 0, dur: 3800 };
}
function drawHint3(){
  if (!hint3) return;
  const k = hint3.t / hint3.dur;
  const a = k < 0.08 ? k/0.08 : (k > 0.86 ? (1-k)/0.14 : 1);
  const col = hint3.key === 'magnet' ? HC.magnet : HC.paint;
  const w = Math.min(HW - 32, 460), x = (HW - w)/2, y = HH * 0.135;
  hctx.save();
  hctx.globalAlpha = Math.max(0, Math.min(1, a));
  hctx.fillStyle = HC.panel; hrr(x, y, w, 40, 12); hctx.fill();
  hctx.strokeStyle = col; hctx.lineWidth = 2; hrr(x, y, w, 40, 12); hctx.stroke();
  hctx.fillStyle = col; hrr(x, y, 4, 40, 2); hctx.fill();
  htFit(S3('hint' + hint3.key[0].toUpperCase() + hint3.key.slice(1)), x + 16, y + 20, 13, col, w - 32, 'left', '800');
  hctx.restore();
}

// The first build drew the title straight over the tumbling blocks and neither could be read.
// The scene is the background here, so the text needs a ground of its own: a scrim top and
// bottom, title up top, the button down in the thumb zone where a phone wants it.
function drawMenu3(){
  hctx.clearRect(0, 0, HW, HH);
  hudButtons = [];

  const scrim = (y, h, from, to) => {
    const g = hctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, from); g.addColorStop(1, to);
    hctx.fillStyle = g; hctx.fillRect(0, y, HW, h);
  };
  scrim(0, HH * 0.30, 'rgba(18,15,40,0.92)', 'rgba(18,15,40,0)');
  scrim(HH * 0.62, HH * 0.38, 'rgba(18,15,40,0)', 'rgba(18,15,40,0.94)');

  const ty = HH * 0.13;
  hctx.save();
  hctx.shadowColor = HC.accent; hctx.shadowBlur = 34;
  htFit(S3('title'), HW/2, ty, Math.min(56, HW*0.145), HC.accent, HW*0.86, 'center', '800');
  hctx.restore();
  htFit(S3('sub'), HW/2, ty + 34, 12.5, HC.dim, HW*0.86, 'center', '700');

  const bw = Math.min(280, HW*0.74), bh = 58;
  hbutton('play3', (HW-bw)/2, HH*0.80 - bh/2, bw, bh, S3('play'), true);
  ht(S3('tap'), HW/2, HH*0.80 + bh/2 + 22, 12.5, HC.dim, 'center', '600');
  if (best3 > 0) ht(S3('bestScore', {n: best3}), HW/2, HH*0.80 - bh/2 - 22, 12.5, HC.accent, 'center', '700');
}

function drawOver3(){
  const k = Math.min(1, (now3 - overAt3) / 260);
  hctx.save();
  hctx.globalAlpha = k * 0.72; hctx.fillStyle = '#171432'; hctx.fillRect(0, 0, HW, HH);
  hctx.restore();
  hudButtons = [];
  const bw = Math.min(HW*0.86, 360), bh = 250, bx = (HW-bw)/2, by = (HH-bh)/2;
  hctx.save(); hctx.globalAlpha = k;
  hctx.fillStyle = HC.panel; hrr(bx, by, bw, bh, 18); hctx.fill();
  hctx.strokeStyle = HC.line; hctx.lineWidth = 2; hrr(bx, by, bw, bh, 18); hctx.stroke();

  const isBest = st3.score > 0 && st3.score > bestAtStart3;
  const short = bestAtStart3 - st3.score;
  const close = !isBest && bestAtStart3 > 0 && short <= bestAtStart3 * 0.2;
  ht(S3('over'), bx + bw/2, by + 40, 20, HC.text, 'center', '700');
  ht(S3('pts', {n: st3.score}), bx + bw/2, by + 76, 26, HC.accent, 'center', '800');
  htFit(isBest ? S3('newBest') : close ? S3('soClose', {n: short}) : S3('bestScore', {n: bestAtStart3}),
        bx + bw/2, by + 100, 11.5, isBest || close ? HC.accent : HC.dim, bw - 40, 'center', '700');

  const rows = [
    [S3('blast'), String(st3.blasts)],
    [S3('streak', {n: ''}).trim(), `×${st3.bestStreak||0}`],
    [S3('lines'), String(st3.linesTotal)],
    [S3('moves', {n: st3.moves}), ''],
  ];
  rows.forEach(([l, v], i) => {
    const yy = by + 130 + i*20;
    ht(l, bx + 26, yy, 12, HC.dim, 'left', '600');
    if (v) ht(v, bx + bw - 26, yy, 12.5, HC.text, 'right', '800');
  });
  hbutton('menu3', bx + 20, by + bh - 58, (bw-56)/2, 42, S3('menu'), false);
  hbutton('retry3', bx + bw/2 + 8, by + bh - 58, (bw-56)/2, 42, S3('retry'), true);
  hctx.restore();
}

// ─── game3d/main3d.js ─────────────────────────────────────────
// POWER JAM 3D — the concept's game loop.
//
// The RULES are not reimplemented here. src/core/ is the same code the 2D game runs: newRun,
// placeRun, the Painter, the Magnet, the chain, the streak, the multi-line reward. This file is
// only a second presentation of them. That is the whole point of the concept — if the 3D version
// felt better because it played differently, it would prove nothing about 3D.

let st3 = null, scene3 = 'MENU', now3 = 0, last3 = 0, overAt3 = 0;
let best3 = 0, bestAtStart3 = 0, targetHit3 = 0;
let hintsSeen3 = {};
let lockUntil3 = 0;
let W3 = 0, H3 = 0, FOV = 0.86;
let glcv = null, batchCube = null, batchFlat = null, progSolid = null, progFlat = null, progBg = null, bgBuf = null;
const cellBorn = new Float32Array(GRID_W * GRID_H);   // when each cell's block landed

const SAVE3_KEY = 'powerjam3d_v1';
function readSave3(){ try { return JSON.parse(localStorage.getItem(SAVE3_KEY)) || {}; } catch(e){ return {}; } }
function writeSave3(d){ try { localStorage.setItem(SAVE3_KEY, JSON.stringify(d)); } catch(e){} }

// ---------------------------------------------------------------- the target ladder
// Carried over from the 2D game unchanged, including the reason it exists: an endless run with
// no second number beside the score ends at a stop, not at a result.
const LADDER3 = [1000, 2500, 5000, 10000];
function targetMarks3(){
  const marks = LADDER3.slice();
  const reach = Math.max(st3 ? st3.score : 0, bestAtStart3) * 2;
  let v = marks[marks.length - 1];
  while (v < 4000000 && v <= reach){ v *= 2; marks.push(v); }
  if (bestAtStart3 > 0 && !marks.includes(bestAtStart3)) marks.push(bestAtStart3);
  return marks.sort((a, b) => a - b);
}
function runTarget3(){
  const score = st3 ? st3.score : 0;
  for (const v of targetMarks3()) if (v > score) return { value: v, best: bestAtStart3 > 0 && v === bestAtStart3 };
  return null;
}

// ---------------------------------------------------------------- board reads
const idx3 = (x, y) => y * GRID_W + x;
const filled3  = (x, y) => (st3.board.rows[y] >> x) & 1;
const painted3 = (x, y) => (st3.board.painted[y] >> x) & 1;
const broken3  = (x, y) => (st3.board.broken[y] >> x) & 1;
function colorOf3(x, y){
  const c = st3.board.piece[idx3(x, y)];
  return JELLY_RGB[(c > 0 ? c - 1 : 0) % JELLY_RGB.length];
}
function isPainterCell(x, y){
  return !!(st3.painter && st3.painter.cells.some(([px, py]) => px === x && py === y));
}

// ---------------------------------------------------------------- block animation
// A block does not appear. It falls, lands, squashes and settles — the single cheapest thing
// that makes a placement feel like it happened TO the board rather than being switched on.
const DROP_MS = 260, SETTLE_MS = 260;
function blockAnim(age){
  if (age >= DROP_MS + SETTLE_MS || age < 0) return [BLOCK_Y, 1, 1];
  if (age < DROP_MS){
    const t = age / DROP_MS, e = t * t;                        // gravity, not a linear slide
    return [BLOCK_Y + 8.0 * (1 - e), 1 - 0.10 * (1 - e), 1 + 0.22 * (1 - e)];
  }
  const k = (age - DROP_MS) / SETTLE_MS;
  const d = Math.sin(k * Math.PI * 2) * Math.exp(-k * 3.2) * 0.42;   // damped rebound
  return [BLOCK_Y + Math.max(0, d) * 0.30, 1 + d * 0.45, 1 - d * 0.62];
}

// ---------------------------------------------------------------- run lifecycle
function startRun3(){
  const save = readSave3();
  best3 = save.best || 0;
  bestAtStart3 = best3;
  targetHit3 = 0;
  st3 = newRun((Date.now() ^ ((save.runs || 0) * 2654435761)) >>> 0);
  save.runs = (save.runs || 0) + 1; save.best = best3; writeSave3(save);
  cellBorn.fill(-99999);
  clearFx3();
  drag3 = null; hover3 = null;
  scene3 = 'PLAY'; lockUntil3 = 0;
}

// ---------------------------------------------------------------- a move, and its consequences
function doPlace3(ti, gx, gy){
  const piece = PIECES[st3.tray[ti]];
  const ev = placeRun(st3, ti, gx, gy);
  if (!ev) return;

  const cells = piece.cells.map(([dx, dy]) => [gx + dx, gy + dy]);
  for (const [x, y] of cells) cellBorn[idx3(x, y)] = now3;
  let lock = 220;
  sfx3('place');
  cam.shake = Math.max(cam.shake, 0.10);

  if (ev.painterPlaced){ sfx3('paint'); showHint3('painter'); flashAmt = Math.max(flashAmt, 0.25); }
  else if (ev.power === POWERS.MAGNET){ sfx3('magnet'); showHint3('magnet'); }

  // the Magnet's pull: every cell it dragged throws a spark trail toward it
  if (ev.pulled && ev.pulled.moves && ev.pulled.moves.length){
    for (const m of ev.pulled.moves){
      cellBorn[idx3(m.to[0], m.to[1])] = now3 - DROP_MS;   // it slides in, it does not fall in
      shockwave(cellX(m.to[0]), cellZ(m.to[1]), MAGNET_RGB, 1.6, 420);
    }
    lock = Math.max(lock, 300);
  }

  // an ordinary clear: the cubes are launched, they are not deleted
  if (ev.cleared){
    const deep = Math.min(1, (ev.combo - 1) / 6);
    for (const [x, y] of ev.cleared.cells)
      launch(cellX(x), BLOCK_Y, cellZ(y), colorOf3(x, y) || JELLY_RGB[0],
             { up: 7 + deep * 4, spread: 0.7, s: BLOCK_XZ, dur: 1000 });
    cam.shake = Math.max(cam.shake, 0.22 + (ev.cleared.n - 1) * 0.16 + deep * 0.25);
    sfx3('clear', Math.min(ev.combo, 8));
    lock = Math.max(lock, 300);
    if (ev.combo > 1) banner(S3('combo', {n: ev.combo}), '#FFC66D', 620);
  } else if (ev.comboLost >= 2){
    banner(S3('lost', {n: ev.comboLost}), '#FB7185', 700);
    sfx3('fizzle');
  }

  if (ev.multiReward){
    const mr = ev.multiReward;
    banner(S3('linesAtOnce', {n: mr.n}), '#FFC66D', 900);
    popNumber(0, 2.4, 0, mr.kind === 'SPAWN' ? S3('spawned') : S3('empowered'), '', PAINT_RGB);
    shockwave(0, 0, PAINT_RGB, 9, 800);
    flashAmt = 1; cam.kick = 1; cam.shake = Math.max(cam.shake, 0.7);
    freeze3 = 90; lock = Math.max(lock, 620);
    sfx3('reward');
    if (mr.kind === 'SPAWN') cellBorn[idx3(mr.cell[0], mr.cell[1])] = now3;
  }

  // THE BLAST. Anticipation is bought with hit-stop, the release is 10-20 cubes leaving the
  // board at speed with a shockwave under them. This is the moment the concept exists for.
  if (ev.blast){
    const streak = ev.streak || 1;
    freeze3 = 110 + Math.min(120, streak * 20);
    cam.kick = 1; cam.shake = Math.max(cam.shake, 0.85);
    flashAmt = 1;
    shockwave(0, 0, PAINT_RGB, 11, 700);
    for (const [x, y] of (ev.blast.cells || [])){
      const wx = cellX(x), wz = cellZ(y);
      const d = Math.hypot(wx, wz) || 1;
      launch(wx, BLOCK_Y, wz, PAINT_RGB,
             { up: 11, spread: 1.4, s: BLOCK_XZ, glow: 0.9, dur: 1250, dx: wx/d*4, dz: wz/d*4 });
    }
    popNumber(0, 2.2, 0, '+' + ev.blast.points,
              S3('cells', {n: ev.blast.total, m: ev.blast.mult.toFixed(1)}), PAINT_RGB);
    banner(S3('blast'), '#FF5FA2', 900);
    sfx3('charge');
    setTimeout(() => sfx3('blast', streak), 90);
    showHint3('blast');
    lock = Math.max(lock, 700);
  } else if (ev.expired && ev.expired.length){
    sfx3('fizzle');
  }

  fxTarget3();
  lockUntil3 = now3 + lock;

  if (st3.score > best3){ best3 = st3.score; const s = readSave3(); s.best = best3; writeSave3(s); }
  if (st3.phase !== 'PLAYING'){
    sfx3('over');
    setTimeout(() => { if (st3 && st3.phase !== 'PLAYING'){ scene3 = 'OVER'; overAt3 = now3; } }, lock + 320);
  }
}

// A target on the ladder was passed. The record gets the louder one — it is the only mark the
// player set themselves.
function fxTarget3(){
  let top = 0;
  for (const v of targetMarks3()) if (st3.score >= v) top = v;
  if (top <= targetHit3) return;
  const beatBest = bestAtStart3 > 0 && top >= bestAtStart3 && targetHit3 < bestAtStart3;
  targetHit3 = top;
  banner(beatBest ? S3('bestBeaten') : S3('targetCleared', {n: top}), beatBest ? '#FFC66D' : '#FF5FA2', 900);
  cam.kick = Math.max(cam.kick, beatBest ? 0.9 : 0.4);
  flashAmt = Math.max(flashAmt, beatBest ? 0.9 : 0.4);
  sfx3(beatBest ? 'record' : 'reward');
}

// ---------------------------------------------------------------- input
let drag3 = null;      // { ti, cells } — the piece currently in the air
let hover3 = null;     // { x, y, ok } — where it would land
// Centred, not (0,0): a pointer parked at the origin means the idle camera opens the board
// already yawed 15 degrees off, which reads as a broken render rather than as drift.
let pointer3 = { x: -1, y: -1, down: false };
let invVP = null;

function traySlotCenter(i){ return [(i - 1) * 3.05, TRAY_Y, TRAY_Z]; }

// Tray pieces are laid out around their own centre so a 1×5 bar and a 3×3 cube both sit in the
// middle of their slot instead of hanging off one corner.
function trayCells(i){
  const id = st3.tray[i];
  if (id === null || id === undefined) return null;
  const p = PIECES[id];
  const c = traySlotCenter(i);
  const s = p.w > 3 || p.h > 3 ? 0.46 : 0.58;      // long pieces shrink so every slot reads the same
  return p.cells.map(([dx, dy]) => [
    c[0] + (dx - (p.w - 1) / 2) * s, c[1] + 0.34, c[2] + (dy - (p.h - 1) / 2) * s, s * 0.44,
  ]);
}

function pickTray(wx, wz){
  for (let i = 0; i < 3; i++){
    if (st3.tray[i] === null || st3.tray[i] === undefined) continue;
    const c = traySlotCenter(i);
    if (Math.abs(wx - c[0]) < 1.5 && Math.abs(wz - c[2]) < 1.4) return i;
  }
  return -1;
}

function onDown(px, py){
  pointer3.down = true; pointer3.x = px; pointer3.y = py;
  if (scene3 === 'MENU' || scene3 === 'OVER'){
    for (const b of hudButtons)
      if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h){
        if (b.id === 'play3' || b.id === 'retry3') startRun3();
        else if (b.id === 'menu3') scene3 = 'MENU';
        return;
      }
    return;
  }
  if (now3 < lockUntil3) return;
  const g = groundPick(px, py, TRAY_Y);
  if (!g) return;
  const ti = pickTray(g[0], g[2]);
  if (ti >= 0){ drag3 = { ti }; sfx3('pick'); updateHover(px, py); }
}

function onMove(px, py){
  pointer3.x = px; pointer3.y = py;
  if (drag3) updateHover(px, py);
}

function onUp(){
  pointer3.down = false;
  if (drag3 && hover3 && hover3.ok) doPlace3(drag3.ti, hover3.x, hover3.y);
  drag3 = null; hover3 = null;
}

// The finger holds the piece ABOVE the board, and the shadow says where it will land. Lifting it
// is not a nicety on a phone: without it the hand covers the exact cells the choice depends on.
function updateHover(px, py){
  const g = groundPick(px, py - Math.min(70, H3 * 0.09), BLOCK_Y);
  if (!g){ hover3 = null; return; }
  const p = PIECES[st3.tray[drag3.ti]];
  const gx = Math.round(g[0] / CELL + (GRID_W - 1) / 2 - (p.w - 1) / 2);
  const gy = Math.round(g[2] / CELL + (GRID_H - 1) / 2 - (p.h - 1) / 2);
  const x = Math.max(0, Math.min(GRID_W - p.w, gx));
  const y = Math.max(0, Math.min(GRID_H - p.h, gy));
  hover3 = { x, y, ok: canPlace(st3.board, p, x, y),
             preview: canPlace(st3.board, p, x, y) ? previewClear(st3.board, p, x, y) : null };
}

function groundPick(px, py, planeY){
  if (!invVP) return null;
  return pickPlane(invVP, (px / W3) * 2 - 1, 1 - (py / H3) * 2, planeY);
}

// ---------------------------------------------------------------- render
function drawScene(){
  const vpe = viewProj(W3, H3, FOV);
  invVP = invert4(vpe.vp);
  const U = { uVP: vpe.vp, uEye: new Float32Array(vpe.eye),
              uLight: new Float32Array([0.40, 0.88, 0.34]),
              uAmb: new Float32Array([0.42, 0.40, 0.50]),
              uBoost: Math.min(1.2, (st3 ? st3.streak : 0) * 0.18) };

  gl.viewport(0, 0, glcv.width, glcv.height);
  gl.clearColor(0.09, 0.08, 0.20, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  // background room
  gl.useProgram(progBg.p);
  gl.uniform3fv(progBg.u.uTop, new Float32Array(BG_TOP));
  gl.uniform3fv(progBg.u.uBot, new Float32Array(BG_BOT));
  gl.uniform1f(progBg.u.uPulse, flashAmt);
  gl.bindBuffer(gl.ARRAY_BUFFER, bgBuf);
  const aBg = progBg.a('aPos');
  gl.enableVertexAttribArray(aBg);
  gl.vertexAttribPointer(aBg, 3, gl.FLOAT, false, 0, 0);
  instancing.divisor(aBg, 0);
  gl.disable(gl.DEPTH_TEST);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.DEPTH_TEST);

  batchReset(batchCube);
  batchReset(batchFlat);

  const half = (GRID_W * CELL) / 2;
  // the slab, and the tray table in front of it
  push(batchCube, 0, -0.42, 0, half + 0.35, 0.42, half + 0.35, 0,0,0, SLAB_RGB[0], SLAB_RGB[1], SLAB_RGB[2], 0, 1);
  push(batchCube, 0, -0.34, TRAY_Z, 4.55, 0.26, 1.35, 0,0,0, TRAY_RGB[0], TRAY_RGB[1], TRAY_RGB[2], 0, 1);

  if (scene3 !== 'MENU' && st3) drawBoard();
  else drawIdleBoard();

  batchDraw(batchCube, U);

  // shadows and rings last, blended, never writing depth — otherwise a contact shadow punches a
  // hole in the block standing on it
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  batchDraw(batchFlat, { uVP: vpe.vp });
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  return vpe.vp;
}

function shadowFor(x, z, y, size, strength){
  const lift = Math.max(0, y - BLOCK_Y);
  const s = size * (1.55 + lift * 0.22);
  push(batchFlat, x + lift * 0.16, 0.015, z + lift * 0.10, s, 1, s, 0,0,0, 0, 0, 0,
       0, Math.max(0, strength * (1 - lift * 0.055)));
}

function drawBoard(){
  const pulse = 0.5 + 0.5 * Math.sin(now3 / 300);

  // sockets: the empty grid, and the 3×3 regions marked by a slightly lighter floor. The region
  // rule is only playable if the regions are visible.
  for (let y = 0; y < GRID_H; y++) for (let x = 0; x < GRID_W; x++){
    if (filled3(x, y)) continue;
    const reg = ((Math.floor(x / REGION) + Math.floor(y / REGION)) % 2) === 0;
    let c = reg ? SOCKET_RGB : RIM_RGB.map(v => v * 0.35);
    let glow = 0;
    if (hover3 && hover3.preview && drag3){
      const pv = hover3.preview;
      const inReg = (pv.regions || []).some(([bx, by]) => x >= bx && x < bx + REGION && y >= by && y < by + REGION);
      if (pv.rows.includes(y) || pv.cols.includes(x) || inReg){ c = PAINT_RGB; glow = 0.5 + pulse * 0.5; }
    }
    push(batchCube, cellX(x), 0.03, cellZ(y), BLOCK_XZ, 0.035, BLOCK_XZ, 0,0,0, c[0], c[1], c[2], glow, 1);
  }

  // the blocks
  for (let y = 0; y < GRID_H; y++) for (let x = 0; x < GRID_W; x++){
    if (!filled3(x, y)) continue;
    const [by, sxz0, sy0] = blockAnim(now3 - cellBorn[idx3(x, y)]);
    const jig = Math.sin(now3 / 640 + x * 1.7 + y * 2.3) * 0.022;
    const sxz = sxz0 * (1 + jig), sy = sy0 * (1 - jig);
    const isP = painted3(x, y), isB = broken3(x, y), isCore = isPainterCell(x, y);
    const col = isP ? PAINT_RGB : colorOf3(x, y);
    const shrink = isB ? 0.72 : 1;
    const glow = isP ? 0.35 + pulse * 0.45 : (isCore ? 0.30 : 0);
    push(batchCube, cellX(x), by, cellZ(y),
         BLOCK_XZ * sxz * shrink, BLOCK_Y * sy * shrink, BLOCK_XZ * sxz * shrink,
         0, 0, 0, col[0], col[1], col[2], glow, 1);
    shadowFor(cellX(x), cellZ(y), by, BLOCK_XZ, 0.42);
  }

  // the tray: three recessed pads, so an empty slot still reads as a slot
  for (let i = 0; i < 3; i++){
    const c = traySlotCenter(i);
    const busy = st3.tray[i] !== null && st3.tray[i] !== undefined;
    push(batchCube, c[0], -0.03, c[2], 1.32, 0.05, 1.08, 0,0,0,
         SOCKET_RGB[0], SOCKET_RGB[1], SOCKET_RGB[2], busy ? 0.05 : 0, 1);
  }
  for (let i = 0; i < 3; i++){
    if (drag3 && drag3.ti === i) continue;
    const cells = trayCells(i);
    if (!cells) continue;
    const pw = st3.trayPower[i];
    const col = pw === POWERS.PAINTER ? PAINT_RGB : pw === POWERS.MAGNET ? MAGNET_RGB
              : JELLY_RGB[st3.trayColor[i] % JELLY_RGB.length];
    const bob = Math.sin(now3 / 620 + i) * 0.06;
    const glow = pw ? 0.30 + pulse * 0.35 : 0;
    for (const [cx, cy, cz, s] of cells){
      push(batchCube, cx, cy + bob, cz, s, s * 0.9, s, 0, Math.sin(now3/2600 + i) * 0.06, 0,
           col[0], col[1], col[2], glow, 1);
      shadowFor(cx, cz, cy + bob + 0.3, s, 0.30);
    }
  }

  // the piece in the air, and the footprint it will fill
  if (drag3 && hover3){
    const p = PIECES[st3.tray[drag3.ti]];
    const pw = st3.trayPower[drag3.ti];
    const col = pw === POWERS.PAINTER ? PAINT_RGB : pw === POWERS.MAGNET ? MAGNET_RGB
              : JELLY_RGB[st3.trayColor[drag3.ti] % JELLY_RGB.length];
    const y = HOVER_Y + Math.sin(now3 / 300) * 0.05;
    for (const [dx, dy] of p.cells){
      const wx = cellX(hover3.x + dx), wz = cellZ(hover3.y + dy);
      push(batchCube, wx, y, wz, BLOCK_XZ, BLOCK_Y, BLOCK_XZ, 0,0,0,
           col[0], col[1], col[2], hover3.ok ? 0.45 : 0, 1);
      if (hover3.ok){
        // the landing footprint: a bright plate exactly where the block will sit
        push(batchCube, wx, 0.05, wz, BLOCK_XZ * 0.95, 0.04, BLOCK_XZ * 0.95, 0,0,0,
             col[0], col[1], col[2], 0.7, 1);
        shadowFor(wx, wz, y, BLOCK_XZ, 0.55);
      } else {
        push(batchCube, wx, 0.05, wz, BLOCK_XZ * 0.95, 0.04, BLOCK_XZ * 0.95, 0,0,0, 0.6, 0.1, 0.2, 0.5, 1);
      }
    }
  }

  drawDebris();
}

// The menu is not a still image: the board plays a slow idle so the first thing anyone sees is
// the material, lit and moving.
function drawIdleBoard(){
  for (let y = 0; y < GRID_H; y++) for (let x = 0; x < GRID_W; x++){
    const reg = ((Math.floor(x / REGION) + Math.floor(y / REGION)) % 2) === 0;
    const c = reg ? SOCKET_RGB : RIM_RGB.map(v => v * 0.35);
    push(batchCube, cellX(x), 0.03, cellZ(y), BLOCK_XZ, 0.035, BLOCK_XZ, 0,0,0, c[0], c[1], c[2], 0, 1);
  }
  const t = now3 / 1000;
  for (let i = 0; i < 14; i++){
    const a = i * 2.399 + t * 0.25;
    const r = 1.2 + (i % 5) * 0.75;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    const yy = BLOCK_Y + 0.28 + Math.sin(t * 1.6 + i) * 0.22;
    const c = JELLY_RGB[i % JELLY_RGB.length];
    push(batchCube, x, yy, z, BLOCK_XZ, BLOCK_Y, BLOCK_XZ, t * 0.3 + i, t * 0.4, 0, c[0], c[1], c[2], 0.10, 1);
    shadowFor(x, z, yy, BLOCK_XZ, 0.35);
  }
  drawDebris();
}

function drawDebris(){
  for (const d of debris){
    const k = d.t / d.dur;
    const fade = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
    push(batchCube, d.x, d.y, d.z, d.s * fade, d.s * fade, d.s * fade,
         d.rx, d.ry, d.rz, d.col[0], d.col[1], d.col[2], d.glow * fade, 1);
    shadowFor(d.x, d.z, d.y, d.s, 0.30 * fade);
  }
  for (const w of waves){
    const k = w.t / w.dur;
    const r = 0.6 + k * w.r;
    push(batchFlat, w.x, 0.03, w.z, r, 1, r, 0,0,0, w.col[0], w.col[1], w.col[2], 1, (1 - k) * 0.75);
  }
}

// ---------------------------------------------------------------- loop
function frame3(t){
  const dt = Math.min(50, t - last3 || 16);
  last3 = t;
  now3 = t;
  updateFx3(dt);
  if (hint3){ hint3.t += dt; if (hint3.t >= hint3.dur) hint3 = null; }

  // The camera drifts with the pointer. It is a small thing and it is most of why a 3D board
  // reads as an object on a table rather than a picture of one.
  const px = pointer3.x < 0 ? W3 / 2 : pointer3.x;
  const targetYaw = ((px / Math.max(1, W3)) - 0.5) * 0.20;
  cam.yaw += (targetYaw - cam.yaw) * Math.min(1, dt / 260);
  if (scene3 === 'MENU') cam.yaw = Math.sin(t / 5200) * 0.28;

  const vp = drawScene();
  if (scene3 === 'MENU') drawMenu3();
  else { drawHud3(vp); if (scene3 === 'OVER') drawOver3(); }

  requestAnimationFrame(frame3);
}

function resize3(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W3 = glcv.clientWidth; H3 = glcv.clientHeight;
  glcv.width = Math.round(W3 * dpr); glcv.height = Math.round(H3 * dpr);
  hudResize(W3, H3, dpr);
  FOV = fitCamera(W3, H3);
}

function boot3(){
  glcv = document.getElementById('gl');
  hudInit(document.getElementById('hud'));
  if (!initGL(glcv)){
    const c = document.getElementById('hud').getContext('2d');
    c.fillStyle = '#0A1018'; c.fillRect(0, 0, 2000, 2000);
    c.fillStyle = '#EAF2F7'; c.font = '600 16px system-ui'; c.textAlign = 'center';
    c.fillText(S3('noWebGL'), 200, 100);
    return;
  }
  LANG3 = (navigator.language || 'en').toLowerCase().startsWith('tr') ? 'tr' : 'en';
  progSolid = compile(VS_SOLID, FS_SOLID);
  progFlat  = compile(VS_FLAT, FS_SHADOW);
  progBg    = compile(VS_BG, FS_BG);
  batchCube = makeBatch(buildRoundedCube(0.55, 7), progSolid, 900);   // round, with smooth normals — see buildRoundedCube
  batchFlat = makeBatch(buildQuad(), progFlat, 900);
  bgBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, bgBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,0, 3,-1,0, -1,3,0]), gl.STATIC_DRAW);

  best3 = readSave3().best || 0;
  resize3();
  window.addEventListener('resize', resize3);

  const pos = e => { const r = glcv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  glcv.addEventListener('pointerdown', e => { glcv.setPointerCapture(e.pointerId); onDown(...pos(e)); });
  glcv.addEventListener('pointermove', e => onMove(...pos(e)));
  glcv.addEventListener('pointerup',   e => onUp());
  glcv.addEventListener('pointercancel', e => onUp());
  document.addEventListener('pointerdown', () => { const a = ac3(); if (a && a.state === 'suspended') a.resume(); }, {once:true});

  requestAnimationFrame(frame3);

  // test hook — the concept is driven by tools/shots3d.mjs the same way the 2D game is
  window.__t3 = {
    core: { PIECES, GRID_W, GRID_H, canPlace },
    get state(){ return st3; }, get scene(){ return scene3; },
    startRun: startRun3, drop: doPlace3, setLang: l => { LANG3 = l; },
    mute: v => { muted3 = v; },
    get debris(){ return debris.length; },
    get gl2(){ return isGL2; },
  };
}

boot3();
</script>
</body>
